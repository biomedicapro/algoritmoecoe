const abdomen = {
  id:'abdomen', label:'Abdomen agudo', eyebrow:'Estación 2 · Urgencias quirúrgicas',
  title:'Abordaje del abdomen agudo', short:'Define estabilidad y peritonismo, orienta el diagnóstico y activa el control del foco.',
  anchor:'Estabilidad → historia → examen → control',
  instruction:'Recibe a un adulto con dolor abdominal, vómito o sangrado digestivo. Identifica shock y peritonitis. Haz preguntas y maniobras dirigidas, pide estudios concretos y decide el tratamiento y destino.',
  steps:[
    step('a0','01','Estabilidad y reanimación','0:00–0:35','¿Está en shock, sangra, tiene sepsis o amenaza de vía aérea?',
      [patient('Soy parte del equipo de urgencias. ¿Cómo se llama y qué es lo que más le preocupa ahora? Vamos a revisar su presión y tratar el dolor.'),
       exam('Evalúo habla, respiración, pulso, piel, relleno, conciencia y sangrado visible. En crítico, primaria ABCDE y reevaluación mientras delego.'),
       team('Dígame PA, FC, FR, SpO₂, temperatura, Glasgow y glucemia si hay alteración. Si inestable, ECG y SpO₂ continuos, PA cada 2–3 min, dos IV 14–16 G, ayuno y llame apoyo. O₂ por reservorio a 15 L/min si crítico/hipoxémico, luego titule a 94–98 %.')],
      ['Reconozco shock con perfusión y tendencia de signos, aunque la PAS inicial sea preservada.','Activo la reanimación y control según causa, de forma simultánea.'],[
      branch('septic-abd','Sepsis abdominal y shock séptico','Infección probable con hipoperfusión o disfunción orgánica, con o sin fiebre.',
        [team('Dos hemocultivos periféricos, lactato, gas, hemograma, electrolitos/creatinina y coagulación. Ringer lactato 500 mL IV en 10–15 min, reevalúe perfusión y congestión. Si shock franco inicie noradrenalina 0,05 mcg/kg/min en bomba en paralelo y titule a PAM 65.'),
         team('Empiece antibiótico idealmente antes de 1 h si shock o sepsis probable. En shock abdominal sin riesgo de BLEE, piperacilina/tazobactam 4,5 g IV en 30 min ahora. Llame a cirugía para control del foco; coordine IR o endoscopia según origen.')],
        [group('Umbral y tiempo','Disfunción orgánica por infección: SOFA aumenta ≥2 si basal conocido o estimable. Alerta si alteración mental, FR ≥22, PAS ≤100, oliguria o hiperlactatemia. qSOFA por sí solo no diagnostica ni excluye. Definición de shock séptico: precisa vasopresor para PAM ≥65 y lactato >2 mmol/L pese a volumen adecuado. Inicie manejo sin esperar que se cumpla la definición.','Obtenga hemocultivos en dos sitios (cada juego aerobio/anaerobio) antes de antibiótico si no retrasa. Si shock posible o sepsis probable/confirmada → antibiótico idealmente ≤1 h. Si sepsis solo posible sin shock → evaluación temporal y antibiótico ≤3 h si persiste sospecha. Identifique foco y controle idealmente ≤6 h desde diagnóstico si lo requiere; peritonitis con deterioro exige activación inmediata.'),
         group('Volumen y objetivos','SSC 2026 sugiere al menos 30 mL/kg de balanceado en primeras 3 h si hipoperfusión séptica; use peso real, o ideal/ajustado si IMC >30. Divida en bolos, no ordene litros a ciegas. Tras 500 mL, mida PAM, relleno, conciencia y signos pulmonares; si hay respuesta a elevación pasiva de piernas/volumen y sin congestión, repita 500 mL. En IC/ERC/frágil pruebe 250 mL en 10–15 min con reevaluación; detenga si no responde o aparece edema y titule vasopresor. Ej. 70 kg: referencia 2.100 mL en 3 h si tolera y responde.','Noradrenalina ejemplo: 4 mg equivalentes de base en 250 mL compatibles (16 mcg/mL), iniciar 0,05 mcg/kg/min (13,1 mL/h a 70 kg); incrementar 0,02–0,05 mcg/kg/min cada 2–5 min a PAM 65. Si no hay central, vía periférica proximal de buen calibre y exclusiva, observe sitio al menos cada 5–10 min inicialmente y consiga acceso definitivo si persiste o aumenta dosis. Repetir lactato elevado en 2–4 h, diuresis objetivo ≥0,5 mL/kg/h, considerar arterial y UCI. En ≥65 años, individualizar meta (SSC permite 60–65).'),
         group('Siguiente orden','Confirme primera dosis y pauta de Órdenes → Infección intraabdominal. Obtenga cultivo del foco al drenar/operar. Busque la causa con eco o TC según fisiología; sepsis con abdomen rígido y shock → equipo quirúrgico en el box, sin traslado diagnóstico inseguro.')],
        'Antibiótico y control del foco van en paralelo. Si hay hemorragia primaria probable, use su vía de sangre y control.', ['sepsis','sis','idsa','drug'],'a1'),
      branch('gi-shock','Sangrado digestivo activo o shock','Hematemesis, melena o hematoquecia abundante con síncope, FC alta, PA baja o mala perfusión.',
        [team('Dos vías 14–16 G. Hemograma, grupo/Rh y cruzadas, INR/TTPa, fibrinógeno si masivo, BUN/creatinina, electrolitos, hepático, gas/lactato y calcio ionizado si transfundimos. Active sangre de emergencia y paquete masivo si exanguina. Llame a gastroenterología, IR y anestesia según caso.'),
         exam('Protejo vía aérea si hematemesis activa con alteración de conciencia. Distingo origen alto, bajo y variceal, y selecciono endoscopia o angio-TC según el sangrado.')],
        [group('Reanimación','Si shock hemorrágico, administre 2 U de glóbulos rojos de emergencia calentados IV de inicio mientras llega el paquete según magnitud y banco. Titule y reevalúe cada unidad si es posible; en sangrado activo grave no espere Hb. Si estable, umbral usual Hb <7 g/dL; administre 1 U IV y controle respuesta/Hb. Considere umbral ~8 con cardiopatía preexistente y plan distinto en isquemia activa. En variceal estable, objetivo Hb 7–8 g/dL.','Revise fármacos, hora y función renal; interrumpa anticoagulante activo y revierta selectivamente si sangrado potencialmente mortal/no controlado. Vea Orden Reversión hemostática. En cirrosis, no corrija INR con plasma por el número aislado. No use tranexámico de rutina en hemorragia digestiva.'),
         group('Origen y tiempo','Hematemesis/melena o hematoquecia con datos de sangrado alto → endoscopia alta después de iniciar reanimación, acelerar si persiste inestabilidad. Si cirrosis/sospecha portal, inicie octreótido y ceftriaxona ya (rama variceal). Hematoquecia hemodinámicamente significativa persistente con origen bajo probable → angio-TC protocolizada de sangrado activo y IR si positiva.')],
        'Una hemoglobina inicial normal no excluye pérdida aguda. No demore reanimación por endoscopia o TC.', ['ugi','esgeBleed','lgi','var','aabb','antico'],'a1'),
      branch('aaa-rupture','Aneurisma de aorta abdominal roto','Adulto mayor con dolor súbito abdominal/lumbar, síncope, shock o AAA conocido; puede mejorar brevemente.',
        [team('Active cirugía vascular, anestesia y transfusión masiva. Dos vías grandes, sangre calentada. Hasta control aórtico, meta PAS aproximadamente 70–90 mmHg si conserva conciencia, ajuste hacia 90 según perfusión. Sala híbrida/quirófano ya si no tolera traslado.'),
         exam('Ecografía aórtica en el box si está disponible sin demoras. Si puede trasladarse con equipo y sangre, angio-TC de aorta toracoabdominal y accesos iliofemorales IV arterial para planear reparación.')],
        [group('Decisión por respuesta','La tríada dolor, shock y masa pulsátil es poco sensible. Eco detecta aneurisma, pero no descarta ruptura retroperitoneal. Si respuesta transitoria: continúe como sangrado activo; CTA rápida solo si el equipo puede mantener perfusión y no demora control. Si PAS cae por debajo del objetivo o se altera conciencia, priorice 1 U de glóbulos rojos calentados IV al inicio con reevaluación y paquete según magnitud. Evite cristaloides a grandes volúmenes.','EVAR si anatomía/recursos favorables, reparación abierta si no. Avise centro vascular antes de traslado, mantenga equipo/sangre. Si hemorragia digestiva y antecedente de injerto aórtico, sospeche fístula aortoentérica y avise vascular sin esperar endoscopia.'),
         group('Después del control','UCI y controles seriados de pulsos, diuresis, lactato y creatinina. Distensión tensa, oliguria o presiones ventilatorias crecientes → presión intraabdominal vesical. >20 mmHg sostenida más nueva disfunción orgánica: valorar descompresión urgente con equipo.')],
        'No normalice agresivamente la PA antes de controlar la aorta ni envíe a TC si el traslado es inseguro.', ['aaa','bleed'],'a5')
    ]),
    step('a1','02','Anamnesis dirigida','0:35–1:10','¿Qué dato desplaza el diagnóstico y cambia la primera imagen?',
      [patient('Señáleme con un dedo dónde empezó. ¿Comenzó de golpe o progresivo? ¿Se ha movido o va a la espalda/hombro? ¿Del 0 al 10? ¿Empeora al comer, toser o moverse?'),
       patient('¿Fiebre, vómito, piel amarilla, orina oscura, sangre o heces negras? ¿Cuándo eliminó gases y evacuó por última vez? ¿El vómito empezó antes o después del dolor?'),
       patient('¿Cirugías o hernias? ¿Cálculos, úlcera, cirrosis, fibrilación auricular o aneurisma? ¿Alergias, anticoagulantes, antiinflamatorios o alcohol? ¿Última dosis y última ingesta?'),
       patient('Cuando aplica: ¿Fecha de última menstruación, posibilidad de embarazo, sangrado o flujo vaginal? ¿Dolor urinario, en flanco o testículo?')],
      ['Pregunto inicio, irradiación, migración y síntomas clave.','Verifico antecedente quirúrgico, fármacos relevantes, embarazo y alergias.']),
    step('a2','03','Exploración y peritonitis','1:10–1:45','¿Hay irritación peritoneal, dolor desproporcionado o una urgencia extraintestinal?',
      [patient('Voy a examinar su abdomen; avíseme cuándo aumenta el dolor. Empiezo donde menos le duele.'),
       exam('Inspecciono distensión, cicatrices, ictericia y hernias. Ausculto sin usar ruidos para descartar obstrucción. Percuto suavemente y palpo de superficial a profundo lejos del dolor. Busco defensa involuntaria, rigidez o dolor al toser/percusión.'),
       exam('Según caso: Murphy con inspiración, McBurney y maniobras apendiculares, puñopercusión, regiones inguinales y pulsos. Tacto rectal si cambia conducta (sangrado/impactación); pelvis o genitales si indicados, con consentimiento y acompañante clínico.')],
      ['Busco rigidez/defensa involuntaria y no repito rebote doloroso.','La ausencia de signos francos no excluye isquemia, perforación inicial o enfermedad en paciente frágil.'],[
      branch('peritonitis','Peritonitis secundaria, absceso o fuga posoperatoria','Rigidez/defensa involuntaria, dolor al mínimo movimiento, sepsis o recaída tras cirugía.',
        [team('Ayuno, accesos, antibiótico IV y cirugía ahora. Si shock y peritonitis generalizada, active control quirúrgico sin demora por TC. Si estable, TC abdomen/pelvis con contraste IV y avise posible absceso o fuga.'),
         exam('Fluidos según perfusión. Absceso localizado accesible: consulte drenaje guiado y cultivo. Peritonitis difusa o fuga no contenida: cirugía de control del foco.')],
        [group('Qué pedir e interpretar','TC IV fase portal en estable; si fuga anastomótica, radiología y cirugía pueden añadir contraste hidrosoluble oral o rectal dirigido si no retrasa. Colección con realce periférico y gas apoya absceso; gas aislado posoperatorio depende del día y evolución. Taquicardia nueva, íleo, fiebre, oliguria o aumento de dolor obligan a reevaluar aunque la herida sea normal.','Leve comunitario sin alto riesgo: ceftriaxona 2 g IV cada 24 h + metronidazol 500 mg IV cada 8 h. Postoperatorio/shock sin alto riesgo BLEE: piperacilina/tazobactam 4,5 g IV de carga. Si alto riesgo BLEE, meropenem 1 g IV. Esquemas, infusión y renal en Órdenes. Cultivos de foco y desescalar.'),
         group('Control y reevaluación','Foco localizado con acceso seguro → drenaje percutáneo + antibiótico, vigilar débito y evolución. Peritonitis fecal/purulenta difusa, fuga libre, isquemia o falla de drenaje → cirugía. Tras control adecuado, pauta típica hasta 4 días; individualice en críticos y bacteriemia. Si shock o dolor persiste, reevaluar fuente, repetir TC si seguro o reintervenir, en vez de prolongar automáticamente.')],
        'Cirugía temprana y antibióticos tienen que activarse juntos. La TC solo agrega valor cuando se puede hacer con seguridad.', ['sis','idsa','sepsis','drug'],'a4'),
      branch('perforation','Úlcera péptica perforada','Dolor epigástrico súbito, defensa o abdomen en tabla, AINE o antecedente ulceroso.',
        [team('Ayuno, cirugía inmediata, ceftriaxona 2 g IV ahora más metronidazol 500 mg IV ahora si comunitario estable; si shock use el esquema de sepsis. Solicite TC abdomen/pelvis IV si tolera y no retrasa control.'),
         exam('Si shock y peritonitis evidente, voy directo a control del foco. Busco aire libre o defecto gastroduodenal. Descompresión por sonda si vómitos/distensión con vía aérea protegida.')],
        [group('Diagnóstico','TC IV: aire extraluminal, discontinuidad, líquido libre. Si TC no está disponible, Rx tórax de pie si puede o decúbito para aire libre; Rx negativa no excluye. TC equívoca y estable, sin peritonitis: valorar contraste hidrosoluble dirigido con cirugía/radiología. Excepcional observación si perforación sellada demostrada, sin sepsis ni peritonitis y capacidad de rescate inmediato.','Ayuno, sonda NG si indicada, IBP ejemplo pantoprazol 40 mg IV cada 24 h durante ayuno y ajustar a hallazgo. Antibiótico y orden analgésica de soporte. Inestable → laparotomía; estable → laparoscopia si equipo, cierre primario en defecto pequeño <2 cm con o sin parche según hallazgo. Biopsia/seguimiento en úlcera gástrica según aspecto y cirugía.'),
         group('Después','Boey (0–3) suma comorbilidad mayor, shock preoperatorio y perforación >24 h, estima riesgo; no pospone cirugía. UCI si disfunción. Revisión de AINE/H. pylori y erradicación dirigida tras la estabilización.')],
        'La seguridad de la imagen depende de fisiología y de si retrasa cirugía.', ['ppu','sis','sepsis'],'a4'),
      branch('pregnancy-abd','Embarazo ectópico y urgencia anexial','Potencial gestante con dolor bajo/síncope, sangrado vaginal o dolor unilateral brusco.',
        [team('β-hCG sérica cuantitativa, grupo/Rh y cruzadas según riesgo. Si shock con embarazo posible y hemoperitoneo, llame a ginecología y anestesia, inicie sangre y prepare quirófano.'),
         exam('Estable, pido ecografía transvaginal y abdominal dirigida. Si dolor unilateral abrupto con vómitos, sospecho torsión y aviso ginecología aunque el Doppler muestre flujo.')],
        [group('Decisiones','No espere resultado de β-hCG si hay colapso y hemoperitoneo con alta sospecha. Estable con prueba positiva y localización indeterminada: ginecología, β-hCG seriada (habitualmente a 48 h) y eco de control, instrucciones de alarma. La cifra aislada de hCG no localiza el embarazo.','Dolor abdominal no obstétrico durante embarazo: US, luego RM sin gadolinio si apropiado y disponible; si demora peligrosa o imagen inconclusa y alta sospecha, consensúe TC necesaria. Si cuadro escrotal agudo con alta sospecha de torsión, urología urgente.')],
        'Ectópico roto puede simular apendicitis o AAA. No dar de alta un embarazo de localización desconocida sin seguimiento seguro.', ['ect','acr'],'a4')
    ]),
    step('a3','04','Diagnóstico e imagen dirigida','1:45–2:55','¿Qué combinación de localización, evolución y hallazgos elige la rama?',
      [exam('Formulo diagnóstico principal y alternativo de riesgo. Diferencio dolor focal, colestasis, infección, obstrucción, isquemia y sangrado.'),
       team('En cuadro quirúrgico o sistémico: hemograma, sodio, potasio, bicarbonato, BUN, creatinina y glucosa. Agregue según rama: lipasa, hepático con bilirrubina total/directa, uroanálisis, β-hCG si aplica, gas/lactato si hipoperfusión o isquemia; cruzadas/INR si sangra, anticoagulado o cirugía probable.'),
       exam('Ordeno la modalidad y contraste de la rama. Epigastralgia de riesgo cardíaco: ECG 12 derivaciones en 10 min y troponina de alta sensibilidad seriada por protocolo. Si cetoacidosis probable, glucosa, gas venoso, bicarbonato y β-hidroxibutirato.')],
      ['Elijo una prueba inicial concreta con modalidad, contraste y prioridad.','Interpreto el resultado y digo qué hallazgo cambia la conducta.'],[
      branch('biliary-colic','Colelitiasis sintomática','Dolor HCD/epigastrio sostenido que cede en horas, sin fiebre, ictericia o irritación peritoneal.',
        [team('Solicite ecografía hepatobiliar y, si dolor activo o síntomas atípicos, hemograma, bilirrubina total/directa, AST/ALT, FA, GGT y lipasa. Si no hay contraindicación, ketorolaco 15 mg IV lento una vez.'),
         exam('Si US muestra cálculos sin inflamación, dolor resuelto y tolera vía oral, indico controles y cirugía electiva. Dolor >6 horas, fiebre, Murphy o ictericia → ramas biliar inflamatoria u obstructiva.')],
        [group('Discriminantes','Dolor típico continuo durante 30 min a varias horas, a veces posprandial e irradiado a espalda/hombro. US: cálculo móvil con sombra, pared sin edema, sin líquido perivesicular. Litiasis con dispepsia inespecífica puede ser incidental; evalúe ACS, úlcera, hepatitis, pancreatitis o causas renales según cuadro. No antibiótico en cólico sin infección.','AINE si no embarazo, sangrado, ERC, hipovolemia marcada, úlcera de riesgo o alergia; si contraindicado, use pauta de analgesia en Órdenes. Alta solo si dolor controlado, tolera VO, no hay datos inflamatorios ni colestasis preocupante y seguimiento. Explique retorno por dolor persistente, fiebre, vómito o ictericia.')],
        'Un cálculo incidental no explica por sí solo un cuadro atípico.', ['wch','asge'],'a5'),
      branch('chole','Colecistitis aguda y complicaciones','Dolor HCD persistente, Murphy o sensibilidad local con inflamación sistémica.',
        [team('Ecografía hepatobiliar ahora, hemograma, PCR, bilirrubina fraccionada, AST/ALT, FA/GGT, lipasa y creatinina. Ayuno, avise cirugía. Si comunitaria estable, ceftriaxona 2 g IV en 30 min cada 24 h más metronidazol 500 mg IV en 60 min cada 8 h según riesgo anaerobio y protocolo.'),
         exam('Si hay gas de pared, necrosis, perforación o disfunción orgánica, acelero control, activo sepsis y uso TC IV si estable. Plan de colecistectomía temprana o drenaje en quien no tolera cirugía.')],
        [group('Diagnóstico y gravedad TG18','A local: Murphy o dolor/masa/sensibilidad HCD. B sistémico: fiebre, leucocitosis o PCR elevada. A+B sospecha; A+B+imagen característica confirma. US: pared engrosada (interprete con contexto), líquido perivesicular, cálculo impactado y Murphy ecográfico; US dudosa con sospecha puede requerir HIDA si estable y disponible. TC IV para complicación, no como tamiz rutinario.','Grado I: no cumple II/III. II: cualquiera de leucocitos >18.000, masa dolorosa HCD, síntomas >72 h o inflamación local marcada (gangrena, enfisema, absceso, peritonitis biliar). III: al menos disfunción orgánica TG18 (ver rama colangitis para umbrales). TC gangrena: realce mural irregular/ausente; enfisematosa: gas mural/luminal sin instrumentación reciente; perforada: defecto y colección/bilis libre.'),
         group('Control','Colecistectomía laparoscópica durante el ingreso, idealmente lo antes posible (WSES dentro de 7 días de ingreso y 10 del inicio si factible). Grado III: reanimación y equipo experto; paciente no apto → valorar colecistostomía guiada, excepto si perforación libre/peritonitis exige control quirúrgico según equipo. En no complicada con control completo, no continuar antibiótico posoperatorio de rutina. Complicación con infección residual requiere pauta ajustada.')],
        'Fiebre e ictericia con obstrucción requieren evaluar colangitis y posible drenaje de vía biliar.', ['tgC','wch','sis','tgRx'],'a4'),
      branch('cbd','Coledocolitiasis: baja, intermedia o alta probabilidad','Ictericia/colestasis, litiasis o dilatación de colédoco en imagen, sin sepsis necesariamente.',
        [team('Ecografía hepatobiliar y bilirrubina total/directa, FA, GGT, AST/ALT y lipasa. Si cálculo en colédoco, colangitis o bilirrubina >4 mg/dL junto a colédoco dilatado, llame a endoscopia para CPRE.'),
         exam('Si probabilidad intermedia: colangio-RM sin contraste IV o ecoendoscopia. Si baja y colelitiasis sintomática, plan de colecistectomía según cirugía.')],
        [group('Criterios ASGE','Alta: cálculo visible en colédoco, colangitis ascendente, o BT >4 mg/dL más dilatación (>6 mm con vesícula, >8 mm poscolecistectomía). CPRE terapéutica o exploración ductal intraoperatoria según recursos y acuerdo; con colangitis, rama urgente.','Intermedia: hepatograma anormal, edad >55 o dilatación aislada. Colangio-RM/ecoendoscopia o colangiografía intraoperatoria según contexto. Baja: ninguno de estos predictores. La BT >4 aislada, sin cálculo ni colangitis, no basta para CPRE directa.'),
         group('Cierre','CPRE con extracción y terapia de la causa cuando es viable. Sin sepsis, no antibiótico de rutina por obstrucción aislada; evalúe indicaciones endoscópicas específicas. Tras extracción con vesícula in situ, colecistectomía del mismo ingreso si factible en complicaciones y según riesgo quirúrgico.')],
        'Evite CPRE diagnóstica en probabilidad intermedia. Si aparece shock o fiebre, evalúe colangitis enseguida.', ['asge','esge'],'a4'),
      branch('cholangitis','Colangitis aguda y drenaje','Inflamación sistémica más colestasis o evidencia de obstrucción; la tríada puede faltar.',
        [team('Dos hemocultivos si no retrasan, hemograma, PCR, bilirrubina fraccionada, FA/GGT, AST/ALT, creatinina, coagulograma y lactato. Antibiótico IV y endoscopia ahora. En shock, noradrenalina y antibiótico de sepsis mientras coordinamos CPRE urgente.'),
         exam('US hepatobiliar si no retrasa drenaje. Si inestable, descompresión con stent o drenaje primero. Si no hay CPRE, coordino traslado o drenaje biliar percutáneo urgente.')],
        [group('TG18: diagnóstico','A sistémico: fiebre >38 °C/escalofríos, o leucocitos <4.000/>10.000 o PCR ≥1 mg/dL. B colestasis: BT ≥2 mg/dL o FA/GGT/AST/ALT >1,5 veces el límite superior. C imagen: dilatación o causa obstructiva. Sospecha A+(B o C); definitivo A+B+C. Triada Charcot (dolor HCD, fiebre, ictericia) es orientadora; hipotensión/confusión sugieren gravedad.'),
         group('TG18: severidad y tiempo','Grado II si ≥2: leucocitos >12.000 o <4.000, T ≥39, edad ≥75, BT ≥5 mg/dL, albúmina <0,7 × límite inferior normal. Grado III si cualquiera: noradrenalina o dopamina ≥5 mcg/kg/min, alteración de conciencia, PaO₂/FiO₂ <300, oliguria o creatinina >2 mg/dL, INR >1,5, plaquetas <100.000/µL. Grado I si no cumple II/III.','Shock: organice drenaje inmediatamente tras iniciar estabilización, ideal control del foco ≤6 h según SSC cuando sea viable; ESGE en shock dentro de 12 h. Grado II: temprano, objetivo operativo ≤48 h según ASGE/contexto. Grado I: tratar, confirmar causa y resolver obstrucción; si no mejora, acelerar drenaje.'),
         group('Antibiótico y observación','Comunitaria estable: ceftriaxona 2 g IV cada 24 h, añadir metronidazol 500 mg IV cada 8 h si riesgo anaerobio (p. ej. anastomosis bilioentérica) o protocolo. Grave/posinstrumentación: piperacilina/tazobactam 4,5 g IV carga, o meropenem 1 g IV si riesgo BLEE, según Órdenes. Cultivo de bilis al drenar. Tras drenaje efectivo, TG18 suele 4–7 días; individualice bacteriemia y foco no controlado. UCI si disfunción.')],
        'Antibióticos solos pueden ser insuficientes ante obstrucción infectada. En shock no espere colangio-RM.', ['tgA','tgRx','asgeC','esge','sepsis','drug'],'a4'),
      branch('appendix','Apendicitis, perforación y absceso','Dolor migratorio a FID, anorexia/fiebre, defensa focal; presentación atípica en mayor o embarazo.',
        [team('Hemograma con diferencial, PCR, creatinina y β-hCG si aplica. Si adulto no gestante con diagnóstico incierto, TC abdomen/pelvis IV fase portal, dosis baja si disponible. Si embarazo, US con compresión graduada y luego RM sin gadolinio si no concluye.'),
         exam('Confirmada no complicada: cirugía y laparoscopia dentro de 24 h, profilaxis IV preincisión. Perforación libre o peritonitis: cirugía urgente y antibiótico. Absceso contenido: decisión de laparoscopia o drenaje/antibiótico según edad, anatomía y recursos.')],
        [group('Criterios y riesgo','Dolor FID, migración, defensa, fiebre y neutrofilia. AIR suma vómito (1), dolor FID (1), defensa o rebote leve/moderado/intenso (1–3), T ≥38,5 (1), leucocitos 10–14,9 o ≥15 ×10³/µL (1/2), neutrófilos 70–84 o ≥85 % (1/2) y PCR 10–49 o ≥50 mg/L (1/2). En validación contemporánea: 0–3 bajo, 4–8 intermedio, 9–12 alto; úselo con reevaluación. En US apéndice ciego no compresible >6 mm más signos secundarios; TC: dilatación, realce y estriación grasa; absceso/aire extraapendicular apoyan complicación.','Anciano, inmunosupresión, embarazo y dolor atípico: umbral bajo de imagen y consulta. Diagnósticos alternos: ectópico/torsión, cólico ureteral, Crohn, diverticulitis derecha.'),
         group('Tratamiento por variante','No complicada: ceftriaxona 2 g IV + metronidazol 500 mg IV, dosis preincisión coordinada dentro de 60 min y sin duplicar si ya cubierto; no pauta posoperatoria habitual. Adulto muy seleccionado con no complicada confirmada, sin apendicolito, seguimiento fiable y decisión informada: alternativa de antibióticos por cirugía; recurrencia y fracaso deben explicarse.','Perforada: control del foco + esquema comunitario o sepsis de Órdenes, WSES usual 2–3 días tras control adecuado en complicada. Absceso periappendicular estable: <35 años, laparoscopia temprana si centro experto, alternativa antibióticos/drenaje si no viable; ≥35, manejo inicial no operatorio si contenido y tolera, drenaje si accesible y apendicectomía de intervalo 6–12 semanas para descartar neoplasia, evaluación colónica según cirugía. Peritonitis, deterioro o foco no controlado invalidan esperar. Plastrón sin colección drenable: antibiótico y observación con cirugía, reevaluar.')],
        'Un absceso contenido estable y una perforación libre se tratan por vías distintas. El dolor o shock progresivo obliga a cambiar de plan.', ['app','acr','air','sis'],'a4'),
      branch('divert','Diverticulitis simple o complicada','Dolor FII, fiebre o cambio de tránsito; TC muestra engrosamiento focal y grasa pericólica reactiva.',
        [team('TC abdomen/pelvis con contraste IV fase portal si primer episodio relevante, duda diagnóstica o sospecha complicada. Hemograma, PCR y función renal.'),
         exam('Si no complicada, inmunocompetente y sin inflamación sistémica, puede ir sin antibiótico con seguimiento. Si absceso, inmunosupresión o sepsis, antibiótico y cirugía; si colección grande, IR; si peritonitis, control urgente.')],
        [group('TC y gravedad','Engrosamiento sigmoideo y estriación sin colección, extravasación o aire distante sugieren no complicada. PCR elevada (p. ej. ≥150 mg/L) aumenta sospecha de complicación sin reemplazar TC. Absceso <4–5 cm: ensayo antibiótico si estable; ≥4–5 cm: antibiótico + valorar drenaje percutáneo según acceso y recursos. Si falla, cirugía. Peritonitis purulenta/fecal (Hinchey III/IV) o shock: control quirúrgico.','En comunitaria estable que requiere esquema oral y tolera: amoxicilina/clavulanato 875/125 mg VO cada 12 h durante 5–7 días, ajustar a evolución y política local, evitar presentación 875 si ClCr <30. Si ClCr 10–30, 500/125 mg VO cada 12 h; <10 cada 24 h previa verificación/coordinación. Hospital grave: esquema de Órdenes.'),
         group('Disposición','Alta vigilada si dolor controlado, tolera VO, sin sepsis/complicación, y seguimiento fiable; reevaluación precoz 48–72 h si síntomas, máximo 7 días. Valorar colonoscopia tras episodio complicado al resolver, típicamente 6–8 semanas, según última colonoscopia y riesgo; síntomas persistentes/alarma merecen estudio.')],
        'Si hay inmunosupresión o signos sistémicos, la rama ambulatoria sin antibiótico puede ser insegura.', ['divert','sis','drug'],'a4'),
      branch('pancreatitis','Pancreatitis aguda','Epigastralgia típica hacia dorso, lipasa elevada o imagen característica.',
        [team('Solicite lipasa, hemograma, hematocrito, BUN/creatinina, electrolitos, calcio y hepatograma; triglicéridos si etiología incierta. Ecografía hepatobiliar. Si tolera sin sobrecarga, Ringer lactato a 1,5 mL/kg/h IV. Solo si hipovolemia, 10 mL/kg IV en 2 h y revalore.'),
         exam('Si cumple 2 de 3 criterios no pido TC solo para confirmar. Colangitis → CPRE urgente. Si no mejora a 48–72 h o diagnóstico dudoso, TC IV dirigida según función y contexto.')],
        [group('2 de 3 y escalas','Dolor típico, lipasa o amilasa ≥3 × límite superior normal, imagen compatible. La lipasa ayuda al diagnóstico; repetirla no monitoriza resolución. Ultrasonido para etiología biliar. TG >1.000 mg/dL favorece etiología si no hay otra. BISAP (0–5): BUN >25 mg/dL, mentación alterada, SIRS, edad >60 y derrame pleural, 1 c/u; ≥3 eleva necesidad de vigilancia. Atlanta: leve sin falla ni complicación, moderada si falla transitoria <48 h o complicación, grave si falla persistente >48 h.'),
         group('Ringer y reevaluación','Ej. 70 kg: 105 mL/h; si hipovolemia sin shock franco, 700 mL en 2 h, luego ajustar. Reevaluar signos, BUN/Hto, pulmón, diuresis ≥0,5 mL/kg/h en primeras 6 h, antes si crítico, y durante 24–48 h. Si congestión/IC/ERC, reduzca o suspenda; shock manifiesto se maneja inmediatamente según la causa. No pauta agresiva fija.'),
         group('Tratamiento y causa','Analgesia/antiemético de Órdenes, dieta oral baja en grasa temprana mientras tolere (24–48 h o antes en leve), enteral por sonda si no tolera y curso grave. Sin antibiótico profiláctico en pancreatitis sin infección/necrosis estéril. Si sospecha necrosis infectada y deterioro, TC y equipos expertos, antibiótico con penetración según cultivos (p. ej. meropenem por Órdenes si grave), drenaje escalonado; en estable diferir intervención cerca de 4 semanas si posible.','Pancreatitis biliar con colangitis: CPRE dentro de 24 h, antes si shock. Sin colangitis, no CPRE urgente rutinaria; si colestasis persistente/dilatación, confirme cálculo con colangio-RM/EUS si estable. Colecistectomía mismo ingreso en leve biliar; en grave con colecciones acuerde momento con cirugía.')],
        'Evite indicar antibiótico por lipasa elevada o TC temprana por rutina. Ajuste el volumen a función y evolución.', ['pan','panLatam'],'a4'),
      branch('obstruction','Obstrucción intestinal y vólvulo','Dolor cólico, distensión, vómitos y falta de gases/heces; dolor continuo o peritonismo sugieren complicación.',
        [team('Ayuno, cirugía, hemograma, electrolitos, creatinina y lactato. TC abdomen/pelvis IV fase portal para transición e isquemia. Si vómitos o distensión marcada, sonda NG 14–18 Fr a succión intermitente baja tras confirmar posición.'),
         exam('Asa cerrada, hiporrealce, neumatosis de riesgo, perforación, hernia estrangulada o peritonitis → quirófano y antibiótico ahora. Adhesiva simple estable → descompresión y observación vigilada.')],
        [group('Descompresión, pérdidas y contraste','Active balance y mida débito NG cada 4 h. Si hipovolemia no hemorrágica, Ringer lactato 500 mL IV en 15 min (250 mL si riesgo de congestión), revalore PAM, perfusión y pulmón. Si alcalosis hipoclorémica por pérdidas, use SSN 0,9 % para reponer como punto de partida 1 mL por cada mL perdido en el bloque siguiente, corrija según volemia y laboratorios; potasio solo tras K/función renal/diuresis verificados. Registre orina.','TC IV sin esperar contraste oral en obstrucción alta de riesgo. TC con punto de transición y dilatación proximal; dos puntos cercanos, remolino, edema, líquido libre y poco realce alertan sobre asa cerrada/isquemia. Lactato normal temprano no excluye estrangulación.'),
         group('Adhesiva no complicada','Evaluación por cirugía, abdomen cada 4 h como punto de partida, electrolitos/riñón en 6–12 h y antes si deterioro. Contraste hidrosoluble solo en candidato sin alarma/alto riesgo de aspiración y bajo protocolo (p. ej. iohexol 100 mL por NG tras 2 h de descompresión, pinzar 2 h, Rx a 8 y/o 24 h según protocolo). Si no llega a colon en 24 h, alto riesgo de fracaso. Hasta 72 h solo si permanece estable y sin signos de isquemia, antes si dolor o deterioro.'),
         group('Vólvulo','Sigmoide sin isquemia/perforación: endoscopia descompresiva urgente y sonda rectal, luego sigmoidectomía mismo ingreso. Si falla, isquemia o perforación → resección urgente. Vólvulo cecal → cirugía/resección, no detorsión colonoscópica rutinaria. Pieza y ostomía según viabilidad y fisiología.')],
        'Asa cerrada con signos de isquemia no entra a prueba de contraste ni espera 72 horas.', ['sbo','volv','hernia'],'a4'),
      branch('hernia','Hernia complicada','Masa dolorosa irreductible; piel violácea, dolor intenso, obstrucción o peritonitis sugieren estrangulación.',
        [team('Ayuno, cirugía urgente, acceso y analgésico. Si sospecha estrangulación, prepare quirófano y cubra gramnegativos/anaerobios si isquemia o perforación.'),
         exam('Si hay signos de isquemia o peritonitis, no intento reducción. Si estable y diagnóstico incierto, TC abdomen/pelvis IV si no demora control.')],
        [group('Qué modifica conducta','Explore ambas ingles, ombligo, cicatrices y femorales. Hernia femoral y síntomas prolongados reducen umbral quirúrgico. En hernia inguinal agudamente irreductible sin signos de estrangulación puede considerarse reducción suave por equipo experto, con analgesia monitorizada y observación después, más reparación programada. Si falla, urgencias. Tras reducción con dolor persistente, sospeche reducción en masa o isquemia y reevalúe.','Estrangulación o perforación → exploración, valoración de viabilidad, resección si procede y reparación según contaminación. No reduzca a la fuerza.')],
        'La aparente desaparición del bulto con persistencia del dolor no prueba resolución.', ['hernia','herniaSurge','sbo'],'a4'),
      branch('mesenteric','Isquemia mesentérica aguda','Dolor desproporcionado, FA/aterosclerosis, o bajo flujo con deterioro; con peritonitis puede haber necrosis.',
        [team('Cirugía general y vascular ahora. Angio-TC mesentérica urgente con contraste IV, fases arterial y venosa portal, cortes ≤1 mm, sin contraste oral. Lactato, gas y creatinina van en paralelo.'),
         exam('Con peritonitis o deterioro incompatible con traslado, laparotomía inmediata. Si arterial sin peritonitis, revascularización urgente. Si trombosis venosa sin peritonitis, inicio heparina IV si no hay contraindicación.')],
        [group('No se excluye con lactato','FA/dolor abrupto orienta a embolia arterial; aterosclerosis y dolor posprandial crónico a trombosis; vasopresores/bajo gasto a no oclusiva; trombofilia/tumor/inflamación a trombosis venosa. Lactato puede ser normal temprano. Sospecha alta → angio-TC incluso con lesión renal aguda, sin esperar creatinina si retrasa. Avise a radiología de sospecha para protocolo.'),
         group('Tratamiento por mecanismo','Oclusión arterial: revascularización endovascular/abierta según anatomía, centros y peritonitis; resecar no viable y considere segunda mirada 24–48 h. Ayuno, NG si indicada, corregir perfusión, cobertura amplia precoz si arterial/NOMI con isquemia sospechada. NOMI: corregir bajo gasto/hipovolemia y titular vasopresor a mínimo eficaz, considerar vasodilatación intraarterial experta; peritonitis → OR.','Venosa sin peritonitis: HNF 80 U/kg IV bolo y 18 U/kg/h en bomba según nomograma, anti-Xa a 6 h objetivo 0,3–0,7 UI/mL o TTPa según protocolo. Si alto riesgo hemorrágico o procedimiento inmediato, acuerde modificar/omitir bolo; evite HNF en sangrado mayor activo o antecedente HIT sin plan alterno. No antibiótico sistemático en trombosis venosa aislada sin infección/isquemia complicada. Si deterioro o necrosis → cirugía.')],
        'No demore angio-TC por lactato normal o creatinina pendiente. Los signos peritoneales cambian a control quirúrgico.', ['mes','esvsMes','heparin','sis'],'a4'),
      branch('upper-gi','Hemorragia digestiva alta no variceal','Hematemesis, melena o hematoquecia con shock; AINE, antecedente ulceroso o sangrado.',
        [team('NPO, dos accesos según magnitud, hemograma, BUN/creatinina, INR, grupo/Rh y cruzadas. Avise gastroenterología para endoscopia tras reanimación, en general ≤24 h, antes si inestabilidad persiste.'),
         exam('Si estable y Glasgow-Blatchford 0–1 sin sangrado activo, considero alta vigilada. Si lesión de alto riesgo tratada, ordeno pantoprazol 80 mg IV de carga y 8 mg/h IV por 72 h.')],
        [group('Qué cambia conducta','Glasgow-Blatchford usa BUN, Hb por sexo, PAS, FC, melena, síncope, hepatopatía e IC. 0–1 orienta alta solo si se confirmó bajo riesgo, signos estables, soporte y seguimiento. Si sangrado grave/activo, reanimación y valoración de vía aérea; eritromicina 250 mg IV en 20–30 min, 30–90 min antes de endoscopia, si gran carga de sangre/coágulos y sin QT prolongado, interacciones o alergia.','Puede considerarse IBP IV preendoscópico si sospecha no variceal y no retrasa. Forrest Ia/Ib/IIa → hemostasia endoscópica con terapias definitivas; adrenalina sola no basta. IIb, experto considere retirar coágulo y tratar estigma. IIc/III no hemostasia dirigida.'),
         group('Después del control','Tras 72 h de alta dosis en lesión de alto riesgo: pantoprazol 40 mg VO cada 12 h hasta completar 14 días desde endoscopia, luego diario según lesión y riesgo. Si vuelve a sangrar → repetir endoscopia, embolización si falla, cirugía si ésta falla/no hay. Investigue H. pylori y erradique si positivo, repita si negativa aguda y persiste sospecha, confirme curación.')],
        'Pantoprazol no sustituye hemostasia ni modifica el requisito de reanimación en shock.', ['ugi','esgeBleed','aabb'],'a4'),
      branch('variceal','Hemorragia alta por hipertensión portal','Cirrosis o hipertensión portal con hematemesis/melena, hasta demostrar otra causa.',
        [team('Octreótido 50 mcg IV lento ahora y 50 mcg/h IV continuo por 2–5 días; ceftriaxona 1 g IV en 30 min cada 24 h hasta 7 días según curso. Gastroenterología, endoscopia en ≤12 h tras reanimación. Proteja vía aérea si no la controla o hematemesis activa masiva.'),
         exam('Ligadura para várices esofágicas. Si alto riesgo tras control, evalúo TIPS preemptivo. Si falla, puente por expertos y TIPS de rescate.')],
        [group('Metas y procedimientos','En estable, transfusión restrictiva con objetivo Hb 7–8 g/dL, individualice cardiopatía, shock y sangrado. Evite plasma por INR aislado. Si várices gástricas fúndicas, hemostasia específica por equipo (adhesivo tisular/estrategia endovascular según anatomía y experiencia). No suspender vasoactivo solo por mejoría inicial; duración 2–5 días según riesgo.','TIPS preemptivo ≤72 h ideal <24 si Child-Pugh C 10–13 o B >7 con sangrado activo en endoscopia (criterios adicionales según equipo). Si sangrado refractario, considerar stent esofágico autoexpandible o balón como puente bajo protección de vía aérea y cuidados expertos, luego TIPS. UCI/intermedio según gravedad.')],
        'Inicie vasoactivo y antibiótico cuando lo sospecha, antes de endoscopia.', ['var','ugi','aabb'],'a4'),
      branch('lower-gi','Hemorragia digestiva baja','Hematoquecia de probable origen colónico; evaluar fuente alta si shock, melena o cirrosis.',
        [team('Si sangrado rojo significativo persistente, angio-TC abdomen/pelvis IV para sangrado activo con fase sin contraste, arterial y venosa, sin contraste oral. Si extravasa, llame a IR para arteriografía y embolización.'),
         exam('Si estable y cesó, evalúo Oakland y comorbilidades; colonoscopia programada/no urgente según riesgo y preparación. Hematoquecia con inestabilidad también puede tener fuente alta.')],
        [group('Estratificación','Oakland integra edad, sexo, antecedente de ingreso por sangrado bajo, hallazgo al tacto, FC, PAS y Hb. ≤8 apoya alta en autolimitado de bajo riesgo y seguimiento seguro, sin usar puntaje solo. Si hospitaliza, colonoscopia no urgente en la mayoría tras preparación, no colonoscopia sin limpiar colon. Angio-TC negativa y sangrado cesa → observación o endoscopia según curso.'),
         group('Persistencia','Si CTA positiva, IR inmediato. Si falla o no existe y sangrado amenaza vida, equipo de cirugía con localización si posible. Si datos de origen alto, gastro para endoscopia alta. Si dolor importante + hematoquecia y bajo flujo, valore colitis isquémica; si desproporcionado/peritonismo, rama mesentérica.')],
        'Si el sangrado es activo con deterioro, la preparación para colonoscopia no debe demorar control.', ['lgi','ugi','antico'],'a4')
    ]),

  ['ABCDE','Vía aérea, respiración, circulación, déficit neurológico y exposición. x prioriza hemorragia externa exanguinante.'],
  ['eFAST','Ecografía extendida focalizada en trauma; examina pericardio, pleura y líquido intraperitoneal.'],
  ['PAS · PAM','Presión arterial sistólica y presión arterial media.'],
  ['SpO₂ · EtCO₂','Saturación por pulsioximetría y CO₂ al final de espiración.'],
  ['BVM · VNI','Bolsa-válvula-mascarilla y ventilación no invasiva.'],
  ['ClCr · BUN','Depuración de creatinina y nitrógeno ureico sanguíneo.'],
  ['HCD · FID · FII','Hipocondrio derecho, fosa ilíaca derecha y fosa ilíaca izquierda.'],
  ['IR · UCI','Radiología intervencionista y unidad de cuidados intensivos.'],
  ['CPRE · EUS','Colangiopancreatografía retrógrada endoscópica y ecoendoscopia.'],
  ['TEVAR · EVAR','Reparación endovascular de la aorta torácica y abdominal, respectivamente.'],
  ['HNF · BLEE','Heparina no fraccionada y betalactamasas de espectro extendido.'],
  ['RL · SSN','Ringer lactato y solución salina normal al 0,9 %.'],
  ['TCE · PIC · PPC','Traumatismo craneoencefálico, presión intracraneal y presión de perfusión cerebral.'],
  ['AMPLE','Alergias, medicamentos, antecedentes, última ingesta y eventos.']
];

const branchIndex = stations.flatMap((station) =>
  station.steps.flatMap((stage,index) => stage.branches.map((item) => ({station, stage, index, item})))
);
const stationNow = () => stations.find((entry) => entry.id === state.stationId);
const sessionNow = () => state.sessions[state.stationId];
const caseNow = () => casesByStation[state.stationId].find((entry) => entry.id === sessionNow().caseId);
const branchMatch = (id) => branchIndex.find(({item}) => item.id === id);
const ui = {
  stationBar:byId('station-bar'), hero:byId('hero'), work:byId('work'), dialog:byId('dialog'),
  dialogTitle:byId('dialog-title'), dialogContent:byId('dialog-content'), announcer:byId('announcer')
};

function announce(message) { ui.announcer.textContent = message; }

function formatTime(ms) {
  const wholeSeconds = Math.ceil(Math.max(0,ms) / 1000);
  const min = String(Math.floor(wholeSeconds / 60)).padStart(2,'0');
  const sec = String(wholeSeconds % 60).padStart(2,'0');
  return min + ':' + sec;
}

function focusContent(scroll = true) {
  const heading = byId('focus-heading');
  if (!heading) return;
  if (scroll) heading.scrollIntoView({block:'start'});
  heading.focus({preventScroll:true});
}

function renderNav() {
  document.body.dataset.station = state.stationId;
  document.querySelectorAll('[data-mode]').forEach((button) => {
    button.setAttribute('aria-current',button.dataset.mode === state.mode ? 'page' : 'false');
  });
  ui.stationBar.innerHTML = stations.map((station,i) =>
    `<button class="station-button" type="button" data-station-id="${station.id}" aria-pressed="${station.id === state.stationId}">
      <span>0${i+1}</span>${html(station.label)}
    </button>`
  ).join('');
}

function renderHero(station) {
  const cue = station.id === trauma.id ? ['x','A','B','C','D','E'] : ['PA','Hx','EF','Dx','Tx'];
  const cues = cue.map((tag) => `<span>${html(tag)}</span>`).join('');
  const eyebrow = state.mode === 'orders' ? 'Referencia · Urgencias del adulto' : station.eyebrow;
  const title = state.mode === 'orders' ? 'Órdenes médicas' : station.title;
  const description = state.mode === 'orders'
    ? 'Consulta dosis, vías, tiempos de infusión, ajustes y criterios de repetición.' : station.short;
  ui.hero.innerHTML = `<section class="hero ${station.id === abdomen.id ? 'calm' : ''}">
    <div><div class="eyebrow">${html(eyebrow)}</div><h1>${html(title)}</h1><p>${html(description)}</p></div>
    ${state.mode === 'orders' ? '' : `<div class="hero-cue" aria-hidden="true">${cues}</div>`}
  </section>`;
}

function sequenceHTML(station, index, locked) {
  const rows = station.steps.map((stage,i) =>
    `<li><button type="button" data-stage="${i}" aria-current="${index === i ? 'step' : 'false'}" ${locked ? 'disabled' : ''}>
      <span class="tag" aria-hidden="true">${html(stage.tag)}</span>
      <span><strong>${html(stage.title)}</strong><small>${html(stage.span)}</small></span>
    </button></li>`
  ).join('');
  return `<aside class="sequence card" aria-label="Secuencia de la estación"><h2>Secuencia</h2><ol>${rows}</ol></aside>`;
}

function titleFor(stage) {
  return `<div class="step-context"><span class="tag" aria-hidden="true">${html(stage.tag)}</span>
    <span class="step-time">${html(stage.span)}</span></div>
    <h2 id="focus-heading" tabindex="-1">${html(stage.title)}</h2>`;
}

function renderScript(actions) {
  return `<div class="script">${actions.map(({role,line}) =>
    `<div class="line" data-role="${role}"><span class="role">${html(roleLabels[role])}</span>
      <p>${role === 'exam' ? html(line) : `«${html(line)}»`}</p></div>`
  ).join('')}</div>`;
}

function refsHTML(keys) {
  return `<ul class="reference-list">${Array.from(new Set(keys)).map((key) => {
    const [title,url] = sources[key];
    return `<li><a href="${html(url)}" target="_blank" rel="noreferrer">${html(title)}</a></li>`;
  }).join('')}</ul>`;
}

function detailHTML(groups) {
  return `<div class="detail-copy">${groups.map(({title,items}) =>
    `<section class="detail-group"><h4>${html(title)}</h4>${items.map((line) => `<p>${html(line)}</p>`).join('')}</section>`
  ).join('')}</div>`;
}

function branchBody(item, station, withReturn) {
  const returnStage = station.steps.findIndex(({id}) => id === item.next);
  const buttons = (branchOrderLinks[item.id] || []).map((id) => {
    const order = orders.find((entry) => entry.id === id);
    return `<button class="quiet" type="button" data-order="${id}">${html(order.title.split(' · ')[0])}</button>`;
  });
  if (withReturn && returnStage >= 0) {
    buttons.unshift(`<button class="quiet" type="button" data-stage="${returnStage}">Volver a la secuencia · ${html(station.steps[returnStage].tag)}</button>`);
  }
  for (const [id,label] of linkedBranches[item.id] || []) {
    buttons.push(`<button class="quiet" type="button" data-jump="${id}">${html(label)}</button>`);
  }
  return `<div class="branch-body">
      ${renderScript(item.short)}
      <p class="critical"><strong>Error crítico.</strong> ${html(item.critical)}</p>
      <details class="detail-block" data-expanded="${item.id}" ${state.details.has(item.id) ? 'open' : ''}>
        <summary>Ampliar criterios, variantes y órdenes</summary>
        ${detailHTML(item.details)}${refsHTML(item.refs)}
      </details>
      ${buttons.length ? `<div class="branch-links">${buttons.join('')}</div>` : ''}
    </div>`;
}

function branchHTML(item,station) {
  const open = state.branches.has(item.id);
  return `<div class="branch-item ${open ? 'open' : ''}" id="branch-${item.id}">
    <button class="branch-toggle" type="button" data-branch="${item.id}" aria-expanded="${open}" aria-controls="body-${item.id}">
      <span><strong>${html(item.title)}</strong><small>${html(item.ifText)}</small></span>
      <span class="expand-glyph" aria-hidden="true">${open ? '−' : '+'}</span>
    </button>
    <div id="body-${item.id}" ${open ? '' : 'hidden'}>${open ? branchBody(item,station,true) : ''}</div>
  </div>`;
}

function branchesHTML(stage, station) {
  if (!stage.branches.length) return '';
  const buckets = new Map();
  for (const item of stage.branches) {
    const category = diagnosticGroups[item.id] || '';
    if (!buckets.has(category)) buckets.set(category,[]);
    buckets.get(category).push(item);
  }
  const groupHTML = [...buckets].map(([label,items]) =>
    `<div class="subgroup">${label ? `<h4 class="subgroup-label">${html(label)}</h4>` : ''}
      <div class="branch-list">${items.map((item) => branchHTML(item,station)).join('')}</div>
    </div>`
  ).join('');
  return `<section class="branch-zone" aria-label="Variantes que cambian la conducta"><h3>Si encuentras…</h3>${groupHTML}</section>`;
}

function checksHTML(stage, checks, namespace) {
  return `<div class="checkbox-stack">${stage.checkpoints.map((point,i) => {
    const key = stage.id + '-' + i;
    return `<label><input type="checkbox" data-check="${key}" data-check-group="${namespace}" ${checks.has(key) ? 'checked' : ''}>
      <span>${html(point)}</span></label>`;
  }).join('')}</div>`;
}

function stageControls(station,index) {
  const prev = index === 0 ? '<span></span>' :
    `<button class="quiet" type="button" data-stage="${index-1}">Anterior</button>`;
  let next;
  if (index < station.steps.length-1) {
    next = `<button class="primary" type="button" data-stage="${index+1}">Siguiente paso</button>`;
  } else if (state.mode === 'mock') {
    next = '<button class="primary" type="button" data-clock-action="finish">Cerrar estación</button>';
  } else {
    next = '<button class="primary" type="button" data-go="mock">Practicar estación</button>';
  }
  return `<div class="controls">${prev}${next}</div>`;
}

function renderGuide(station) {
  const index = state.guideStages[station.id];
  const stage = station.steps[index];
  return `<div class="board">
    ${sequenceHTML(station,index,false)}
    <article class="workspace card">${titleFor(stage)}<p class="step-intro">${html(stage.question)}</p>
      ${renderScript(stage.actions)}${branchesHTML(stage,station)}${stageControls(station,index)}
    </article>
    <aside class="right-rail" aria-label="Apoyo de memoria">
      <section class="card rail-box guide-time"><h2>Ensayo con cronómetro</h2>
        <p>1 min para leer. 4 min para actuar.</p><button class="primary" type="button" data-go="mock">Abrir simulacro</button>
      </section>
      <section class="card rail-box"><h2>Verifica en voz alta</h2>${checksHTML(stage,state.guideChecks,'guide')}</section>
      <section class="card rail-box"><h2>Secuencia de memoria</h2><p>${html(station.anchor)}</p>
        <button class="quiet" type="button" data-open="rehearsal">Ver el guion completo</button></section>
    </aside>
  </div>`;
}

const stageRequests = {
  tx:'Dígame signos, estado inicial y si hay sangrado visible o pulso central.',
  ta:'¿Qué oigo en la vía aérea y responde con frases? Describa boca y cuello.',
  tb:'Dígame SpO₂, frecuencia, expansión, auscultación y hallazgos torácicos.',
  tc:'Dígame pulso, perfusión, abdomen, pelvis y presión después de intervenir.',
  td:'Dígame Glasgow, pupilas, glucemia, motor y sensibilidad.',
  te:'Dígame temperatura, hallazgos al exponer y estado neurovascular distal.',
  tf:'Dígame signos repetidos, evolución, intervenciones y respuesta.',
  a0:'Dígame PA, pulso, frecuencia respiratoria, saturación, temperatura y perfusión.',
  a1:'Dígame qué refiere después de preguntar por inicio, síntomas, cirugías y fármacos.',
  a2:'Al inspeccionar, percutir y palpar, ¿encuentro rigidez, defensa o dolor localizado?',
  a3:'Dígame qué hallazgos dirigidos cambian la probabilidad clínica.',
  a4:'Dígame tolerancia, dolor, función renal y respuesta a las órdenes.',
  a5:'Dígame estado y signos de control. ¿Mejora, recae o sigue inestable?'
};

function disclosure(label, key, prompt, reply, speaker = 'Examinador') {
  const opened = sessionNow().disclosures.has(key);
  return `<details data-disclosure="${key}" ${opened ? 'open' : ''}>
    <summary>${html(label)}</summary><p><span class="prompt-line"><strong>Médico</strong> «${html(prompt)}»</span><strong>${html(speaker)}</strong> «${html(reply)}»</p>
  </details>`;
}

function pendingPrior(station,scenario,stage,session) {
  const required = scenarioGates[scenario.id]?.[stage.id];
  if (required === undefined || session.answers.get(required) === 0 || session.corrected.has(required)) return -1;
  return station.steps.findIndex(({id}) => id === scenario.decisions[required].stage);
}

function repliesHTML(stage, scenario) {
  const [finding,study] = scenario.findings[stage.id] || [];
  const patientPrompt = stage.actions.find(({role}) => role === 'patient')?.line;
  const askPatient = patientPrompt && ['a0','a1','ta','tx'].includes(stage.id);
  const studyOrder = studyOrders[scenario.id + ':' + stage.id];
  const examiner = finding || 'En este paso no se aportan hallazgos adicionales. Verbaliza qué buscarías y vuelve a evaluar si hay un cambio.';
  return `<section class="replies" aria-label="Interacciones de la simulación">
    ${askPatient ? disclosure('Preguntar al paciente',stage.id+'-p',patientPrompt,scenario.reply,'Paciente') : ''}
    ${disclosure('Solicitar hallazgos al examinador',stage.id+'-e',stageRequests[stage.id],examiner)}
    ${study ? disclosure('Ver orden y resultado del estudio',stage.id+'-r',studyOrder,study,'Equipo') : ''}
  </section>`;
}

function clockBox(clock, compact) {
  const labels = {prep:'Lectura disponible', reading:'Lectura', running:'Ejecución', done:'Estación cerrada'};
  const interact = ['reading','running'].includes(clock.phase);
  const time = formatTime(clock.phase === 'done' ? clock.finishTime : clock.remaining);
  const counter = `<span class="timer-digits" data-countdown role="timer" aria-label="Tiempo restante">${time}</span>`;
  const toggle = interact
    ? `<button class="quiet" data-clock-action="toggle" type="button">${clock.active ? 'Pausar' : 'Reanudar'}</button>` : '';
  const finish = clock.phase === 'running'
    ? '<button class="quiet" type="button" data-clock-action="finish">Finalizar intento</button>' : '';
  if (compact) {
    return `<div class="clock-compact"><div>${counter}<span class="step-time">${labels[clock.phase]}</span></div>
      <div class="clock-actions">${toggle}${finish}</div></div>`;
  }
  return `<section class="card rail-box" data-clock><h2>${labels[clock.phase]}</h2>${counter}
    <div class="clock-track" aria-hidden="true"><span data-clock-meter></span></div>${toggle}
    ${finish}
  </section>`;
}

function readingHTML(station, scenario, session) {
  const reading = session.clock.phase === 'reading';
  const cases = casesByStation[station.id];
  return `<article class="workspace card reading">
    <div><h2 id="focus-heading" tabindex="-1">Lectura del caso</h2><p class="step-intro">Un minuto para leer la consigna y preparar tu primera acción.</p></div>
    <div><label for="case-list">Escenario</label><select id="case-list" ${reading ? 'disabled' : ''}>${cases.map((item) =>
      `<option value="${item.id}" ${item.id === scenario.id ? 'selected' : ''}>${html(item.title)}</option>`
    ).join('')}</select></div>
    <section class="brief"><h3>Consigna</h3><p>${html(station.instruction)}</p>
      <p><strong>Paciente de ${scenario.weight} kg.</strong> ${html(scenario.brief)}</p>
    </section>
    <div class="read-actions">
      ${reading ? '' : '<button class="primary" type="button" data-clock-action="reading">Iniciar lectura</button>'}
      <button class="quiet" type="button" data-clock-action="running">${reading ? 'Empezar ejecución ahora' : 'Ir a ejecución'}</button>
      ${reading ? '' : '<button class="text-button" type="button" data-clock-action="random">Caso al azar</button>'}
    </div>
    <p class="session-info">Verbaliza cada orden antes de pedir al examinador el hallazgo. Los intervalos por paso son orientativos.</p>
  </article>`;
}

function optionOrder(scenario,i) {
  const hash = Array.from(scenario.id).reduce((sum, letter) => sum + letter.charCodeAt(0), i);
  return [[0,1,2],[2,0,1],[1,2,0]][hash % 3];
}

function decisionHTML(test,i,scenario,station,session) {
  const answer = session.answers.get(i);
  const passed = answer === 0 || session.corrected.has(i);
  const {item} = branchMatch(test.branchId);
  const buttons = optionOrder(scenario,i).map((option) => {
    const answered = answer !== undefined;
    let css = '';
    if (answered && option === 0) css = ' is-right';
    if (answered && option === answer && answer !== 0) css = ' is-wrong';
    return `<button class="option${css}" type="button" data-choice="${i}:${option}" ${answered ? 'disabled' : ''}>${html(test.choices[option])}</button>`;
  }).join('');
  let feedback = '';
  if (passed) {
    const resume = station.steps.findIndex(({id}) => id === item.next);
    const continueStep = resume >= 0 && resume !== session.stage
      ? `<button class="quiet resume-step" type="button" data-stage="${resume}">Continuar · ${html(station.steps[resume].title)}</button>`
      : '';
    feedback = `<p class="feedback" role="status"><strong>Respuesta del equipo.</strong> ${html(test.consequence)}</p>
      <details class="detail-block" data-disclosure="key-${i}" ${session.disclosures.has('key-'+i) ? 'open' : ''}>
        <summary>Revisar guion de ${html(item.title.toLowerCase())}</summary>${branchBody(item,station,false)}
      </details>${continueStep}`;
  } else if (answer !== undefined) {
    feedback = `<p class="feedback wrong" role="status"><strong>Reconsidera la orden.</strong> ${html(item.critical)} ${html(practiceDeterioration[item.id] || '')}</p>
      <button class="quiet" type="button" data-correct="${i}">Corregir y ver la respuesta</button>`;
  }
  return `<section class="decision" id="decision-${i}"><h3 tabindex="-1">${html(test.question)}</h3>
    <div class="options" role="group" aria-label="Conductas posibles">${buttons}</div>${feedback}</section>`;
}

function closingHTML(station, scenario, session) {
  const answered = scenario.decisions.map((test,i) => ({test,i})).filter(({i}) =>
    session.answers.get(i) === 0 || session.corrected.has(i)
  );
  const outcomes = answered.map(({test}) => `<li>${html(test.consequence)}</li>`).join('');
  const passage = station.id === 'trauma'
    ? 'Recibo a paciente de [edad] por [mecanismo]. Ahora presenta [PA, FC, SpO₂, Glasgow]. La amenaza principal es [lesión]. Realizamos [intervención] y respondió [cambio]. Necesito [destino y tiempo]. ¿Confirma recepción?'
    : 'Recibo a paciente de [edad] con [tiempo y localización]. Tiene [PA, FC y perfusión], [hallazgo clave] y sospecha de [diagnóstico]. Ya recibió [intervención y hora] y respondió [cambio]. Necesito [procedimiento, destino y plazo]. ¿Confirma recepción?';
  const ask = station.id === 'trauma'
    ? 'Dígame PA, FC, SpO₂, Glasgow, sangrado visible y débito del drenaje tras intervenir.'
    : 'Dígame PA, FC, estado mental, dolor, defensa, diuresis y respuesta a la última intervención.';
  return `<section class="rehearsal-open" aria-label="Cierre clínico">
    <h3>Cierre clínico</h3><p><strong>Reevalúa</strong> «${html(ask)}»</p>
    ${outcomes ? `<ul class="summary-list closing-outcomes">${outcomes}</ul>` : ''}
    <p><strong>Entrega al equipo receptor</strong> «${html(passage)}»</p>
    <p>Si hay deterioro, vuelve a ${html(station.steps[0].title.toLowerCase())} y ajusta el destino.</p>
    <button class="quiet resume-step" type="button" data-stage="0">Volver a ${html(station.steps[0].title.toLowerCase())}</button>
  </section>`;
}

function executionHTML(station, scenario, session) {
  const stage = station.steps[session.stage];
  const prior = pendingPrior(station,scenario,stage,session);
  const questions = scenario.decisions.map((test,i) =>
    test.stage === stage.id ? decisionHTML(test,i,scenario,station,session) : ''
  ).join('');
  return `<article class="workspace card">${titleFor(stage)}
    <div class="sim-info"><span>${html(scenario.title)}</span><span>${scenario.weight} kg</span></div>
    <p class="step-intro">${html(stage.question)}</p>
    ${prior < 0 ? repliesHTML(stage,scenario)+questions : `<div class="rehearsal-open"><p>Este hallazgo depende de la intervención previa. Completa la acción y vuelve a evaluar al paciente.</p>
      <button class="quiet" type="button" data-stage="${prior}">Revisar ${html(station.steps[prior].title)}</button></div>`}
    ${session.stage === station.steps.length - 1 ? closingHTML(station,scenario,session) : ''}
    <details class="detail-block" data-disclosure="${stage.id}-script" ${session.disclosures.has(stage.id+'-script') ? 'open' : ''}>
      <summary>Ver guion de apoyo</summary>${renderScript(stage.actions)}
    </details>${stageControls(station,session.stage)}
  </article>`;
}

function resultHTML(station,scenario,session) {
  const correct = [...session.answers.values()].filter((value) => value === 0).length;
  const totalChecks = station.steps.reduce((n,stage) => n + stage.checkpoints.length,0);
  const decisions = scenario.decisions.map((test,i) => {
    const {item} = branchMatch(test.branchId);
    const answer = session.answers.get(i);
    const label = answer === 0 ? 'Correcta al primer intento' : answer === undefined ? 'Pendiente' : 'Revisar';
    return `<li><strong>${html(item.title)}</strong> · ${label}
      <p>${html(test.choices[0])}</p><p>${html(item.critical)}</p>
      <button class="text-button" type="button" data-jump="${item.id}">Abrir rama en la guía</button></li>`;
  }).join('');
  const studies = Object.entries(scenario.findings).filter(([,data]) => data[1]).map(([stageId,data]) => {
    const order = studyOrders[scenario.id + ':' + stageId];
    return `<li><strong>Orden</strong><p>«${html(order)}»</p><strong>Resultado</strong><p>${html(data[1])}</p></li>`;
  }).join('');
  const missing = station.steps.flatMap((stage) => stage.checkpoints.filter((_,i) => !session.checks.has(stage.id+'-'+i)));
  return `<article class="workspace card">
    <h2 id="focus-heading" tabindex="-1">Revisión del intento</h2>
    <p class="step-intro">${html(scenario.title)} · ${formatTime(executionTime - session.clock.finishTime)} de ejecución</p>
    <div class="summary-grid">
      <div class="stat"><strong>${correct}/${scenario.decisions.length}</strong><small>Decisiones correctas al primer intento</small></div>
      <div class="stat"><strong>${session.checks.size}/${totalChecks}</strong><small>Acciones marcadas por ti</small></div>
    </div>
    <h3 class="review-title">Decisiones y errores críticos</h3><ol class="summary-list">${decisions}</ol>
    ${studies ? `<details class="detail-block"><summary>Revisar órdenes y resultados del caso</summary><ul class="summary-list">${studies}</ul></details>` : ''}
    ${missing.length ? `<details class="detail-block"><summary>Acciones sin marcar (${missing.length})</summary>
      <ul class="summary-list">${missing.map((point) => `<li>${html(point)}</li>`).join('')}</ul></details>` : ''}
    <div class="controls"><button class="quiet" type="button" data-go="guide">Regresar a la guía</button>
      <button class="primary" type="button" data-clock-action="reset">Practicar de nuevo</button></div>
  </article>`;
}

function renderMock(station) {
  const scenario = caseNow();
  const session = sessionNow();
  const {phase} = session.clock;
  const isRunning = phase === 'running';
  const center = phase === 'done' ? resultHTML(station,scenario,session)
    : isRunning ? executionHTML(station,scenario,session) : readingHTML(station,scenario,session);
  const right = isRunning
    ? `<section class="card rail-box"><h2>Autoevaluación del paso</h2>
        ${checksHTML(station.steps[session.stage],session.checks,'mock')}</section>`
    : `<section class="card rail-box"><h2>${casesByStation[station.id].length} escenarios</h2>
        <p>Abre cualquier caso y ensaya las decisiones con paciente, examinador y equipo.</p></section>`;
  return `<div class="board">${sequenceHTML(station,session.stage,!isRunning)}
    ${clockBox(session.clock,true)}${center}
    <aside class="right-rail" aria-label="Tiempo y rúbrica">${clockBox(session.clock,false)}${right}</aside>
  </div>`;
}

function renderOrders() {
  return `<div class="order-grid">
    <section class="order-stack" aria-label="Órdenes de referencia">
    ${orders.map((order,i) => `<details class="order-card card" ${i===0 ? 'open' : ''}>
      <summary>${html(order.title)}</summary><div><p class="order-intro">${html(order.intro)}</p>
      ${detailHTML(order.details)}${refsHTML(order.refs)}</div></details>`).join('')}
    </section>
    <aside class="calculator card" aria-label="Cálculos de práctica">
      <h2>Cálculo por peso</h2><p>Para los casos de sepsis y pancreatitis. Usa el peso indicado por cada rama.</p>
      <label for="weight">Peso en kg</label>
      <input id="weight" name="weight" type="number" min="25" max="250" step="0.1" value="70" inputmode="decimal">
      <div id="calculations" aria-live="polite"></div>
    </aside>
  </div>`;
}

function updateCalculator() {
  const input = byId('weight');
  const output = byId('calculations');
  if (!input || !output) return;
  const kg = input.valueAsNumber;
  if (!Number.isFinite(kg) || !input.validity.valid) {
    output.innerHTML = '<p>Ingresa un peso de práctica entre 25 y 250 kg.</p>';
    return;
  }
  const f = (n) => n.toLocaleString('es-CO',{maximumFractionDigits:1});
  output.innerHTML = `<dl>
    <dt>Sepsis · RL inicial de referencia</dt><dd>${f(30*kg)} mL en 3 h si hay hipoperfusión y tolera.</dd>
    <dt>Noradrenalina · 0,05 mcg/kg/min</dt><dd>${f(0.05*kg*60/16)} mL/h si la mezcla es de 16 mcg/mL.</dd>
    <dt>Pancreatitis · RL</dt><dd>${f(1.5*kg)} mL/h. Si hipovolemia, ${f(10*kg)} mL en 2 h y reevaluar.</dd>
    <dt>Diuresis · objetivo frecuente</dt><dd>≥${f(0.5*kg)} mL/h si procede monitorizar.</dd>
  </dl>`;
}

function renderWork() {
  const station = stationNow();
  if (state.mode === 'guide') ui.work.innerHTML = renderGuide(station);
  if (state.mode === 'mock') ui.work.innerHTML = renderMock(station);
  if (state.mode === 'orders') ui.work.innerHTML = renderOrders();
  sessionNow().clock.shown = '';
  updateClockDisplay();
  updateCalculator();
}

function renderAll() {
  renderNav();
  renderHero(stationNow());
  renderWork();
}

function pauseSession() {
  const clock = sessionNow().clock;
  if (!clock.active) return;
  clock.remaining = Math.max(0,clock.deadline-performance.now());
  clock.active = false;
}

function setMode(mode) {
  if (state.mode === 'mock' && mode !== 'mock') pauseSession();
  state.mode = mode;
  renderAll();
  focusContent(false);
}

function setStation(id) {
  if (id === state.stationId) return;
  pauseSession();
  state.stationId = id;
  renderAll();
  ui.stationBar.querySelector('[aria-pressed="true"]').focus({preventScroll:true});
  announce(stationNow().title);
}

function setStage(index) {
  const station = stationNow();
  if (!Number.isInteger(index) || index < 0 || index >= station.steps.length) return;
  if (state.mode === 'mock') {
    if (sessionNow().clock.phase !== 'running') return;
    sessionNow().stage = index;
  } else {
    state.guideStages[state.stationId] = index;
  }
  renderWork();
  focusContent();
  const active = ui.work.querySelector('[aria-current="step"]');
  const list = active?.closest('ol');
  if (list && list.scrollWidth > list.clientWidth) {
    const left = active.getBoundingClientRect().left - list.getBoundingClientRect().left;
    if (left < 0 || left + active.offsetWidth > list.clientWidth) list.scrollLeft += left - 6;
  }
}

function setCase(id) {
  if (!casesByStation[state.stationId].some((item) => item.id === id)) return;
  state.sessions[state.stationId] = createSession(id);
  renderWork();
}

function startClock(phase, duration) {
  const clock = sessionNow().clock;
  clock.phase = phase;
  clock.remaining = duration;
  clock.active = true;
  clock.deadline = performance.now() + duration;
  renderWork();
  focusContent(phase === 'running');
  announce(phase === 'reading' ? 'Lectura iniciada. Un minuto.' : 'Ejecución iniciada. Cuatro minutos.');
}

function closeClock() {
  const clock = sessionNow().clock;
  if (clock.phase !== 'running') return;
  if (clock.active) clock.remaining = Math.max(0, clock.deadline - performance.now());
  clock.phase = 'done';
  clock.finishTime = clock.remaining;
  clock.active = false;
  if (ui.dialog.open) ui.dialog.close();
  renderWork();
  focusContent();
  announce('Estación cerrada. Revisión del intento disponible.');
}

function updateClockDisplay() {
  if (state.mode !== 'mock') return;
  const clock = sessionNow().clock;
  const ms = clock.phase === 'done' ? clock.finishTime : clock.remaining;
  const label = formatTime(ms);
  if (label === clock.shown) return;
  clock.shown = label;
  ui.work.querySelectorAll('[data-countdown]').forEach((node) => {
    node.textContent = label;
    node.classList.toggle('low',clock.phase === 'running' && ms <= 30_000);
  });
  const meter = ui.work.querySelector('[data-clock-meter]');
  const total = clock.phase === 'running' ? executionTime : readingTime;
  if (meter) meter.style.width = (clock.phase === 'done' ? 0 : Math.max(0,ms/total*100)) + '%';
}

function tick() {
  if (state.mode !== 'mock') return;
  const clock = sessionNow().clock;
  if (!clock.active) return;
  clock.remaining = clock.deadline - performance.now();
  if (clock.remaining <= 0) {
    if (clock.phase === 'reading') {
      const remaining = executionTime + clock.remaining;
      startClock('running',Math.max(0,remaining));
      if (remaining <= 0) closeClock();
    } else {
      closeClock();
    }
    return;
  }
  updateClockDisplay();
}

const clockActions = {
  reading:() => startClock('reading',readingTime),
  running:() => startClock('running',executionTime),
  toggle:() => {
    const clock = sessionNow().clock;
    if (clock.active) pauseSession();
    else { clock.deadline = performance.now() + clock.remaining; clock.active = true; }
    renderWork();
    const visibleToggle = [...ui.work.querySelectorAll('[data-clock-action="toggle"]')].find((node) => node.offsetParent);
    if (visibleToggle) visibleToggle.focus({preventScroll:true});
  },
  finish:closeClock,
  reset:() => { setCase(sessionNow().caseId); focusContent(); },
  random:() => {
    const choices = casesByStation[state.stationId].filter((item) => item.id !== sessionNow().caseId);
    setCase(choices[Math.floor(Math.random()*choices.length)].id);
    byId('case-list').focus();
  }
};

function jumpToBranch(id) {
  const match = branchMatch(id);
  if (!match) return;
  if (state.mode === 'mock') pauseSession();
  if (ui.dialog.open) ui.dialog.close();
  state.stationId = match.station.id;
  state.mode = 'guide';
  state.guideStages[state.stationId] = match.index;
  state.branches.add(id);
  renderAll();
  const target = byId('branch-'+id);
  target.scrollIntoView({block:'center'});
  target.querySelector('button').focus({preventScroll:true});
  announce(match.item.title);
}

function openDialog(title, content) {
  ui.dialogTitle.textContent = title;
  ui.dialogContent.innerHTML = content;
  if (!ui.dialog.open) ui.dialog.showModal();
}

function openSources() {
  const terms = terminology.map(([key,text]) => `<dt>${html(key)}</dt><dd>${html(text)}</dd>`).join('');
  openDialog('Fuentes y abreviaturas',
    `<details class="detail-block"><summary>Abreviaturas clínicas</summary><dl>${terms}</dl></details>
      <h3 class="review-title">Guías y protocolos consultados</h3>${refsHTML(Object.keys(sources))}`);
}

function openRehearsal() {
  const station = stationNow();
  const steps = station.steps.map((stage) =>
    `<details class="detail-block" open><summary>${html(stage.title)} · ${html(stage.span)}</summary>
      ${renderScript(stage.actions)}</details>`
  ).join('');
  openDialog('Guion común · 4 minutos',
    `<p class="order-intro">${html(station.anchor)}. Intercala la orden de la rama en cuanto aparezca su criterio.</p>${steps}`);
}

function openOrder(id) {
  const order = orders.find((item) => item.id === id);
  if (!order) return;
  openDialog(order.title,`<p class="order-intro">${html(order.intro)}</p>${detailHTML(order.details)}${refsHTML(order.refs)}`);
}

function search(query) {
  const results = byId('search-results');
  if (!results) return;
  const words = normalize(query.trim()).split(/\s+/).filter(Boolean);
  const matched = branchIndex.filter(({item,station,stage}) => {
    const blob = normalize([item.title,item.ifText,station.label,stage.title,...item.details.flatMap((section) => section.items)].join(' '));
    return words.every((word) => blob.includes(word));
  });
  const shown = words.length ? matched : matched.filter(({station}) => station.id === state.stationId);
  results.innerHTML = shown.length ? shown.map(({item,station,stage}) =>
    `<button class="search-hit" type="button" data-jump="${item.id}">
      <span>${html(item.title)}</span><small>${html(station.label)} · ${html(stage.title)}</small>
    </button>`).join('') : '<p>Sin coincidencias. Prueba con el nombre de una patología o hallazgo.</p>';
}

function openSearch() {
  openDialog('Buscar una rama', `<div class="search-field">
    <label for="branch-query">Patología, hallazgo o intervención</label>
    <input id="branch-query" type="search" placeholder="Ej. taponamiento o colangitis" autocomplete="off">
    </div><div id="search-results" class="search-results"></div>`);
  search('');
  byId('branch-query').focus();
}

function switchBranch(id) {
  const old = byId('branch-'+id);
  const match = branchMatch(id);
  if (!old || !match) return;
  if (state.branches.has(id)) state.branches.delete(id);
  else state.branches.add(id);
  const slot = document.createElement('template');
  slot.innerHTML = branchHTML(match.item,match.station);
  const replacement = slot.content.firstElementChild;
  old.replaceWith(replacement);
  replacement.querySelector('button').focus({preventScroll:true});
}

function answerCase(i,option) {
  const session = sessionNow();
  if (session.answers.has(i) || !caseNow().decisions[i]) return;
  session.answers.set(i,option);
  renderWork();
  document.querySelector('#decision-'+i+' h3')?.focus({preventScroll:true});
}

document.addEventListener('click',(event) => {
  const button = event.target.closest('button');
  if (!button) return;
  const data = button.dataset;
  if (data.mode) setMode(data.mode);
  else if (data.go) setMode(data.go);
  else if (data.stationId) setStation(data.stationId);
  else if (data.stage !== undefined) setStage(Number(data.stage));
  else if (data.branch) switchBranch(data.branch);
  else if (data.open === 'sources') openSources();
  else if (data.open === 'search') openSearch();
  else if (data.open === 'rehearsal') openRehearsal();
  else if (data.jump) jumpToBranch(data.jump);
  else if (data.order) openOrder(data.order);
  else if (data.clockAction) clockActions[data.clockAction]();
  else if (data.choice) {
    const [i,option] = data.choice.split(':').map(Number);
    answerCase(i,option);
  } else if (data.correct !== undefined) {
    const i = Number(data.correct);
    sessionNow().corrected.add(i);
    renderWork();
    document.querySelector('#decision-'+i+' h3')?.focus({preventScroll:true});
  }
});

document.addEventListener('change',(event) => {
  const input = event.target;
  if (input.id === 'case-list') {
    setCase(input.value);
    byId('case-list').focus({preventScroll:true});
  }
  if (input.dataset.check) {
    const checks = input.dataset.checkGroup === 'mock' ? sessionNow().checks : state.guideChecks;
    if (input.checked) checks.add(input.dataset.check);
    else checks.delete(input.dataset.check);
  }
});

document.addEventListener('toggle',(event) => {
  if (!event.target.isConnected) return;
  const {dataset,open} = event.target;
  const set = dataset?.disclosure ? sessionNow().disclosures : state.details;
  const key = dataset?.disclosure || dataset?.expanded;
  if (!key) return;
  if (open) set.add(key);
  else set.delete(key);
},true);

document.addEventListener('input',(event) => {
  if (event.target.id === 'branch-query') search(event.target.value);
  if (event.target.id === 'weight') updateCalculator();
});

renderAll();
setInterval(tick,125);

</script>
</body>
</html>
