const trauma = {
  id: 'trauma', label: 'Politrauma', eyebrow:'Estación 1 · xABCDE / ATLS 11',
  title:'Atención inicial al politraumatizado', short:'Controla la hemorragia externa, trata amenazas vitales y elige el destino según la respuesta.',
  anchor:'Controla → oxigena → perfunde → reevalúa',
  instruction:'Recibe a un adulto lesionado en urgencias. Verbaliza la primaria, ejecuta las maniobras simuladas y delega intervenciones en paralelo. Solicita los hallazgos y decide estudios, tratamiento definitivo y destino.',
  steps: [
    step('tx','x','Hemorragia externa', '0:00–0:25', '¿Hay sangrado exanguinante o ausencia de pulso?',
      [patient('Soy parte del equipo de urgencias. ¿Cómo se llama? Mantenga la cabeza quieta mientras lo reviso.'),
       team('Activen trauma. Díganme mecanismo, hora, signos previos e intervenciones. Coloquen ECG y SpO₂ continuos, presión cada 3 minutos si inestable y tomen temperatura.'),
       exam('Me protejo, miro apósitos, suelo, extremidades y uniones. Si no responde y no respira normalmente, palpo pulso central durante un máximo de 10 segundos.')],
      ['Identifico y controlo en segundos una hemorragia externa crítica.','Si no hay pulso, activo en paralelo la rama de paro traumático.'], [
      branch('ext-bleed','Hemorragia externa masiva','Chorro pulsátil, charco creciente, amputación o compresa que se empapa.',
        [team('Presión directa continua. Si es una extremidad y el sangrado es masivo, coloque torniquete 5–7 cm proximal a la lesión, fuera de articulaciones. Apriete hasta que cese el sangrado y desaparezca el pulso distal. Anote la hora.'),
         exam('Si persiste, ajusto y agrego segundo torniquete en paralelo, inmediatamente proximal. Si es ingle o axila, empaqueto hasta el fondo con gasa hemostática, comprimo al menos 3 minutos según producto y fijo.')],
        [group('Lesión vascular y amputación','Sangrado pulsátil, hematoma expansivo, soplo/frémito más isquemia o pulso distal ausente son signos duros. Compresión en puntos accesibles, nunca pinzamiento ciego; llame a cirugía vascular. Pulsos luego de compresión/reducción según seguridad.','En amputación, cubra el muñón y conserve el segmento en gasa humedecida con SSN 0,9 %, bolsa impermeable cerrada y esa bolsa en agua con hielo. Registre hora e isquemia. Avise cirugía de mano/ortopedia y vascular.')],
        'Aflojar un torniquete en el box sin control definitivo puede reactivar una exanguinación.', ['atls','bleed','nice'],'ta'),
      branch('arrest','Paro cardíaco traumático','Inconsciente, sin respiración normal ni pulso central en ≤10 s, o colapso inminente.',
        [team('Activen paro traumático y transfusión masiva. Controlen hemorragia y empiecen sangre calentada. Ventilen con bolsa-mascarilla y O₂ al 100 %. Equipo entrenado: toracostomías bilaterales inmediatas. Cirugía, valore taponamiento y toracotomía de reanimación.'),
         exam('Inicio compresiones si hay personal sin retrasar las causas reversibles. Identifico ritmo, desfibrilo FV/TV sin pulso y reevalúo pulso/ritmo cada 2 minutos.')],
        [group('HOTT en paralelo','H: detener hemorragia externa, cinturón pélvico si corresponde, sangre inmediata y control proximal/torácico/abdominal por equipo experto. O: bolsa-mascarilla a 100 %, luego vía aérea con capnografía y 10 ventilaciones/min tras vía avanzada. T: toracostomías digitales bilaterales por personal entrenado, luego drenajes si recupera circulación. T: eco pericárdica solo si no retrasa; toracotomía para taponamiento o lesión seleccionada.','RCP 100–120/min, 5–6 cm, 30:2 hasta vía avanzada, priorizando maniobras de causa. FV/TV sin pulso: choque bifásico según equipo (p. ej., 200 J si el fabricante lo admite; si se desconoce, energía máxima disponible). Si un paro médico primario es probable, seguir ALS en paralelo.'),
         group('Decisión y salida','Toracotomía de reanimación en trauma penetrante torácico con pérdida reciente de signos de vida, sobre todo <15 min, si hay experiencia, equipo, entorno y vía inmediata a reparación. En cerrado el rendimiento es bajo, seleccionar con el líder de trauma.','Con retorno de circulación: volver a xABCDE completo, ventilación, sangre y control definitivo. Sin retorno tras tratar causas, decisión de cese con líder y protocolo, según signos de vida, ritmo, mecanismo y tiempos.')],
        'Las compresiones por sí solas no corrigen hipovolemia, hipoxia, tensión ni taponamiento.', ['erc','aha','thorax'],'tx')
    ]),
    step('ta','A','Vía aérea y columna cervical','0:25–0:55','¿Puede hablar, mantener y proteger la vía aérea?',
      [patient('¿Me puede decir su nombre y qué le pasó? ¿Le cuesta respirar o tragar?'),
       exam('Escucho voz, estridor, gorgoteo y ronquido. Inspecciono sangre, vómito, dientes sueltos, trauma facial y cuello. Elevo mandíbula con estabilización manual si hay riesgo cervical.'),
       team('Aspiración rígida y bolsa-mascarilla listas. Mantengan restricción de movimiento cervical si indicada. Avísenme si deja de hablar o cae la saturación.')],
      ['Valoro protección de la vía aérea y mantengo restricción cervical selectiva.','Si hay obstrucción, hipoventilación o deterioro, preparo vía definitiva y confirmo EtCO₂.'], [
      branch('airway','Vía aérea amenazada o fallida','Apnea, incapacidad para proteger, obstrucción progresiva, ventilación ineficaz o Glasgow ≤8 con compromiso.',
        [team('Aspire, haga tracción mandibular y ventile a dos manos con bolsa y O₂ al 100 % si no ventila. Llame a anestesia. Prepare videolaringoscopio, guía, supraglótico, cricotiroidotomía y capnografía.'),
         exam('Optimizo perfusión, preoxigeno y fijo columna manualmente. Intubo con secuencia rápida por operador entrenado. Confirmo curva de CO₂ mantenida y ausculto ambos campos.')],
        [group('Comandos de secuencia rápida','Preoxigene hasta 3 min si tolera con reservorio 15 L/min y sello adecuado; BVM a dos operadores si apnea o insuficiencia. Coloque succión, monitor, dos accesos y plan alterno. Si sospecha neumotórax a tensión, descomprima antes de presión positiva cuando sea posible. La hemorragia exige sangre simultánea.','Ejemplo de inducción en adulto: etomidato 0,3 mg/kg IV una vez o ketamina 1–2 mg/kg IV una vez si perfundido. En shock profundo considere ketamina 0,5–1 mg/kg individualizada por experto, preparada para hipotensión. Después, rocuronio 1,2 mg/kg IV una vez. Mantenga sedación y analgesia durante la parálisis. Evite cánula nasofaríngea y sonda nasal si sospecha fractura de base de cráneo o medio facial.'),
         group('Plan de rescate y posintubación','Hipoxemia durante intento: interrumpa, retome ventilación y reoxigene. Si intubación falla pero ventila, supraglótico de segunda generación como rescate. Si no intuba ni oxigena pese a optimizar, declare emergencia, active cricotiroidotomía quirúrgica en adulto por operador entrenado.','Fije tubo tras EtCO₂ con onda continua, inspección de expansión y auscultación bilateral. Rx portátil para profundidad cuando sea seguro. Ventile 6–8 mL/kg de peso predicho (50 kg en varón o 45,5 kg en mujer más 0,91 × [talla en cm − 152,4]), PEEP inicial 5 cmH₂O y ajuste frecuencia a PaCO₂ 35–45 mmHg, FiO₂ a SpO₂ 94–98 %. Tras reanimación, ejemplo si PAM permite: fentanilo 0,5 mcg/kg IV lento y 25–50 mcg/h más propofol 5–10 mcg/kg/min IV en bomba, titular cada 5 min a sedación y presión. En shock, anestesia selecciona alternativa hemodinámica, como ketamina 0,5–1 mg/kg/h IV; individualizar. Si desatura bruscamente, ventile a mano a 100 % y revise desplazamiento, obstrucción, neumotórax y equipo.')],
        'Tras rocuronio el paciente puede estar consciente sin moverse. Inicie el plan de analgosedación sin esperar que ceda la parálisis.', ['nice','rsi','thorax','tbi'],'tb'),
      branch('neck-wound','Trauma cervical penetrante','Herida cruza platisma, disfonía, hematoma, hemoptisis, estridor o fuga aérea.',
        [team('Avise a anestesia, cirugía de trauma, vascular y otorrino. Si hay sangrado, haga presión focal. Si hay hematoma expansivo, shock, sangrado arterial o vía aérea amenazada, prepare control en quirófano inmediato.'),
         exam('Si está estable y hay lesión profunda sospechada, solicito angio-TC de cuello IV, desde arco aórtico hasta base de cráneo, y tórax según trayecto.')],
        [group('Claves por estabilidad','Estridor, burbujeo, hemoptisis importante, hematoma expansivo, shock, hemorragia activa o déficit vascular: control de vía aérea con plan quirúrgico y exploración urgente. Si anatomía laríngea distorsionada, el enfoque se individualiza con operador experto. Evite sondar la herida o comprimir ambos lados del cuello.','Estable sin signos duros: angio-TC si penetró platisma y hay trayecto/síntomas de riesgo. Dolor al tragar, hematemesis, enfisema o trayecto cercano a esófago pese a TC negativa → esofagograma/endoscopia y valoración ORL según lesión. Incisión superficial confirmada sin violar platisma: atención local.'),
         group('Columna','Collar/restricción si trauma cerrado con criterios o sospecha medular. En penetración aislada sin déficit, la inmovilización rutinaria puede obstaculizar evaluación y control de vía aérea; siga criterios locales.')],
        'No explorar a ciegas ni trasladar a TC al paciente con signos duros y deterioro.', ['neck','nice','atls'],'tb')
    ]),
    step('tb','B','Respiración y tórax','0:55–1:35','¿Qué amenaza ventilatoria o torácica debo tratar ahora?',
      [patient('¿Le falta el aire? ¿Dónde le duele al respirar?'),
       exam('Expongo ambos hemitórax. Comparo expansión y murmullo en ambos lados, palpo crepitación y segmento paradójico, percuto si aporta y miro heridas anterior y lateral.'),
       team('Con hipoxemia o paciente crítico, dé O₂ con mascarilla con reservorio a 15 L/min. Titule a SpO₂ 94–98 % una vez confiable. Dígame FR, SpO₂ y ventilación bilateral. Acerque ecógrafo y equipo de drenaje.')],
      ['Trato tensión clínica antes de imagen.','Reevalúo ventilación, SpO₂ y presión inmediatamente después de la intervención.'], [
      branch('tension','Neumotórax a tensión','Murmullo unilateral muy disminuido más shock o distrés grave, o colapso tras ventilación positiva.',
        [team('Neumotórax a tensión probable. Descomprimo el lado afectado ya. Prepare toracostomía digital y tubo pleural. No espere radiografía.'),
         exam('Descomprimo en 4.º–5.º espacio intercostal lateral por personal entrenado. Si no hay acceso inmediato, uso catéter adulto largo 14 G como puente. Confirme respuesta y luego drenaje definitivo.')],
        [group('Cómo discriminar y ejecutar','Con hipotensión, hipoxia, asimetría y ausencia de murmullo, la desviación traqueal puede faltar. La ecografía, si instantánea, ayuda pero no es requisito; ausencia de deslizamiento también ocurre en intubación selectiva, adherencias o apnea.','Toracostomía digital y tubo en el triángulo de seguridad, 4.º–5.º espacio en región axilar, sobre el borde superior de la costilla inferior. Si solo se dispone de aguja, catéter 14 G largo (aprox. 8 cm en adulto según disponibilidad y anatomía) en 4.º–5.º espacio línea axilar anterior o alternativa 2.º espacio medioclavicular según protocolo. Drenaje a sello de agua, con succión según equipo.'),
         group('Tras descomprimir','Reevalúe presión, pulso, expansión y SpO₂ de inmediato. Si persiste shock: compruebe drenaje/patencia y lado opuesto, busque hemotórax, taponamiento y hemorragia oculta. Rx o US tras la maniobra si no retrasa control. En paciente ventilado descarte también tubo demasiado profundo.')],
        'Una aguja que no mejora al paciente puede haber fallado. Haga drenaje definitivo sin dar por resuelta la tensión.', ['thorax','nice','erc'],'tc'),
      branch('open-ptx','Neumotórax abierto o simple','Herida aspirante con paso de aire, o neumotórax sin datos de tensión.',
        [team('Cubra la herida con sello torácico ventilado. Coloque drenaje pleural por otra incisión y avise a cirugía para cierre. Si empeora tras el sello, levántelo y compruebe tensión.'),
         exam('Repito auscultación, presión y SpO₂. Si neumotórax cerrado y estable, confirmo con US o Rx portátil; TC solo si forma parte del estudio indicado.')],
        [group('Abierto','Sello comercial ventilado si hay; alternativa de puente, apósito oclusivo fijado en tres lados según protocolo local mientras se prepara drenaje y cierre. Vigile conversión a tensión con cualquier sello. Tubo ipsilateral por sitio distinto antes del cierre definitivo. En penetrante, ejemplo cefazolina 2 g IV una vez al insertar, según alergia y protocolo. Si falla ventilación, trate tensión.'),
         group('Pequeño y estable','Neumotórax pequeño (≤2 cm según medición del equipo) y asintomático: observación monitorizada ≥24 h según WSES–AAST, Rx de control local (p. ej. 4–6 h) y ECG/SpO₂ según lesiones. Si crece, hay hipoxemia o presión positiva con riesgo, drene. En pacientes estables seleccionados pueden usarse catéteres pequeños bajo protocolo.')],
        'Nunca coloque el tubo por la herida traumática ni cierre la herida sin una vía de drenaje cuando está indicada.', ['thorax','nice','tubePx'],'tc'),
      branch('hemothorax','Hemotórax masivo','Shock y murmullo disminuido, matidez si explorable, o líquido pleural importante en eFAST.',
        [team('Active transfusión masiva. Prepare tubo pleural 28–32 Fr, sello de agua y calentador. Llame ahora a cirugía torácica y registre volumen inicial y por hora.'),
         exam('Si drena cerca de 1.500 mL al colocarlo, sigue perdiendo sangre o permanece inestable por sangrado torácico, paso a control quirúrgico sin esperar un umbral horario.')],
        [group('Cuantifica y decide','Hemotórax con inestabilidad: tubo de calibre grande en 4.º–5.º espacio lateral sin esperar TC, oxígeno y reanimación hemática. Salida inicial ≥1.500 mL es alarma quirúrgica clásica. WSES–AAST usa inestabilidad de origen torácico, >1.500 mL/24 h o >200 mL/h en 3 h consecutivas sin otra fuente como criterios para intervención. La fisiología prevalece.','Estable con ≥500 mL suele requerir drenaje; <300 mL puede observarse con controles si estable. Retenido tras tubo: si estable, TC y valoración para VATS temprana; si shock, no retrasar control.')],
        'No espere tres horas si persiste el shock. Una baja salida puede reflejar obstrucción del tubo.', ['thorax','bleed'],'tc'),
      branch('flail','Tórax inestable y contusión pulmonar','≥3 costillas contiguas fracturadas en ≥2 sitios o segmento paradójico; hipoxemia que puede empeorar horas después.',
        [team('Oxígeno titulado a 94–98 %, monitor y analgesia titulada. Si fatiga, hipoxemia a pesar de O₂ o no protege vía aérea, prepare intubación. Solicite Rx de tórax o eFAST según estabilidad.'),
         exam('Busco neumotórax/hemotórax asociados, mecánica deficiente y estertores. Si ventila y está estable, solicito fisioterapia respiratoria y valoración temprana de dolor regional.')],
        [group('Escalada','Dolor e hipoventilación favorecen atelectasia. Si perfundido: paracetamol 1 g VO/IV cada 8 h (máx. 3 g/día; 2 g/día en hepatopatía crónica estable, evite hepatopatía aguda grave) y fentanilo 25 mcg IV lento cada 5 min según dolor, FR y PA, máximo inicial 100 mcg antes de nueva reevaluación médica. Reduzca a 12,5 mcg en frágil e interrumpa si sedación, FR <10 o hipotensión. Valore bloqueo regional según coagulación.','VNI solo si cooperador, estable, protege vía y no presenta neumotórax sin drenaje, con capacidad de rescate inmediato. Intube si fracaso, fatiga, deterioro neurológico o hipoxemia persistente y use 6–8 mL/kg de peso predicho. No vendar el tórax.'),
         group('Definitivo','Consulta de pared torácica para fijación costal en tórax inestable o fracturas desplazadas con compromiso pese a analgesia/soporte; considerar 48–72 h si estable. UCI si requiere ventilación o aumenta O₂. Reevalúe serialmente porque la contusión progresa.')],
        'Trate primero las lesiones pleurales y evite bolos innecesarios que agravan edema pulmonar.', ['thorax'],'tc'),
      branch('tamponade','Taponamiento cardíaco traumático','Penetración precordial o trauma cerrado con shock y líquido pericárdico en eFAST.',
        [team('Llame a cirugía cardiotorácica y prepare quirófano ahora. Haga vista pericárdica al lado de la cama si es inmediata. Mantenga sangre y perfusión mientras se organiza el control.'),
         exam('Si pierde el pulso paso al paro traumático y valoro toracotomía de reanimación según mecanismo y tiempo.')],
        [group('Discriminantes','Triada de Beck inconstante y yugulares planas si hipovolemia. eFAST positivo con shock apoya hemopericardio; negativo no excluye lesión si el pericardio se descomprime a pleura, imagen mala o hay coágulo.','Toracotomía/esternotomía y reparación por equipo experto. Pericardiocentesis ecoguiada solo como puente excepcional cuando no hay cirugía inmediatamente disponible; la sangre coagulada puede impedir drenaje. Evite presión positiva innecesaria antes del control si todavía oxigena; si se requiere vía aérea, coordine reanimación y cirugía.')],
        'No mande a TC a un paciente con shock y taponamiento probable.', ['thorax','erc'],'tc'),
      branch('aortic-trauma','Lesión traumática de aorta','Desaceleración de alta energía, mediastino ensanchado, hemotórax izquierdo o lesión periaórtica.',
        [team('Avise a vascular. Si tolera traslado, angio-TC de aorta torácica en fase arterial con contraste IV y reconstrucciones. Si la aorta parece causar shock no controlado, coordine sala híbrida sin demoras.'),
         exam('Busco lesiones que compiten por perfusión. Mantengo metas de TCE o médula y controlo sangrado antes de usar un betabloqueador.')],
        [group('SVS 2026','Grado 1: desgarro intimal. Grado 2: hematoma intramural. Ambos se manejan usualmente sin reparación; grado 1 sin vigilancia rutinaria, grado 2 con imagen a 1–3 meses. Grado 3: pseudoaneurisma, TEVAR según anatomía, habitualmente diferido >24 h en estable con lesiones concurrentes relevantes, urgente si es origen plausible de inestabilidad. Grado 4: rotura libre, reparación emergente. Rx normal no la excluye.','Solo en paciente perfundido y con indicación de vascular, ejemplo para grado 3: esmolol IV 25–50 mcg/kg/min en bomba sin bolo si riesgo, titular cada 5 min según equipo hacia FC 60–80 y PAS 100–120 mmHg, suspendiendo si hipoperfusión, bradicardia/bloqueo AV o broncoespasmo. En TCE/SCI grave no sacrifique perfusión cerebral/medular.')],
        'La hipotensión en trauma con posible lesión aórtica obliga a buscar otras fuentes tratables de sangrado.', ['aorta','thorax','tbi'],'tc'),
      branch('cardiac-injury','Contusión cardíaca y arritmias','Trauma precordial cerrado, arritmia nueva, alteraciones de ST o shock sin fuente clara.',
        [team('ECG de 12 derivaciones y troponina I. Si ECG o troponina anormales, telemetría. Con arritmia persistente o shock, ecocardiograma urgente.'),
         exam('Si taquiarritmia con pulso es la causa del shock, cardioverto sincronizado. Si la taquicardia es compensación a sangrado, trato sangrado.')],
        [group('Estratificación y arritmias','ECG y troponina I normales descartan lesión cardíaca clínicamente significativa según EAST; si muestra muy precoz o sospecha alta, repita a las 4–6 h según protocolo (momento óptimo no definido). Troponina elevada o ECG nuevo: telemetría 24–48 h según curso, troponina seriada. TTE urgente si shock o arritmia sostenida; TEE si ventana mala.','Si taquicardia inestable atribuible al ritmo: parches, modo sincronizado y energía según ritmo y desfibrilador (AHA: FA/flutter 200 J, TSV regular estrecha o TV monomorfa 100 J bifásicos iniciales); sedación si viable sin retrasar. TV polimorfa inestable o FV/TV sin pulso: choque no sincronizado y ALS. Bradicardia con hipoperfusión: atropina 1 mg IV cada 3–5 min, máximo 3 mg; si ineficaz, marcapaso transcutáneo y/o adrenalina 2–10 mcg/min IV en bomba con monitor según ALS y causa.')],
        'No cardiovertir una taquicardia sinusal que compensa hemorragia.', ['bci','aha'],'tc')
    ]),
    step('tc','C','Circulación, abdomen y pelvis','1:35–2:35','¿Hay hipoperfusión? ¿Dónde se pierde sangre y cómo responde?',
      [exam('Palpo pulso central y periférico, piel, relleno capilar y abdomen; miro pelvis, periné y fémures. Busco hemorragia externa, tórax, abdomen, retroperitoneo y huesos largos.'),
       team('Si trauma mayor de riesgo, dos vías periféricas 14–16 G en miembros superiores o intraósea si no obtienen acceso inmediato. Primera extracción: hemograma, grupo/Rh, pruebas cruzadas, TP/INR, TTPa, fibrinógeno, gas con lactato y calcio ionizado, sodio, potasio y creatinina. Muestras sin demorar sangre.'),
       team('Si inestable, eFAST en el box mientras reanimamos. Si persiste shock, diga PA, FC, estado mental, relleno y respuesta después de la primera sangre o maniobra. Bancos de sangre y cirugía, quédense informados.')],
      ['Activo sangre según fisiología y localizo el foco sin esperar hemoglobina.','Elijo control definitivo según eFAST y respuesta a reanimación.','Reconozco que eFAST negativo no descarta sangrado pélvico o intestinal.'], [
      branch('hem-shock','Shock hemorrágico y respuesta a sangre','Sangrado probable con hipoperfusión, índice de shock FC/PAS ≥1, PAS <90 o tendencia descendente.',
        [team('Active transfusión masiva. Inicie 2 U de glóbulos rojos de emergencia calentados ahora si aún no hay paquete, con infusor rápido y vigilancia. Continúe paquete equilibrado de glóbulos rojos, plasma y plaquetas conforme llegue. Cirugía, control del foco ya.'),
         team('Si han pasado ≤3 h y hay sangrado mayor, ácido tranexámico 1 g IV en 10 min, luego 1 g IV en 8 h; confirme dosis previa. Controle calcio ionizado, temperatura y perfusión. Si responde solo un momento, trate como hemorragia activa.')],
        [group('Cuándo activar','Hipoperfusión por hemorragia puede preceder hipotensión o hemoglobina baja. Índice de shock = FC/PAS; ≥1 apoya riesgo, puede engañar con betabloqueo/edad. ABC: 1 punto por PAS ≤90, FC ≥120, FAST positivo y mecanismo penetrante de torso; ≥2 apoya activar, y la clínica puede activarlo con menos puntos.'),
         group('Orden hemática concreta','Pida sangre total O de bajo título si el programa la tiene, o protocolo balanceado 1:1:1 por equivalentes: ejemplo 6 U eritrocitos + 6 U plasma + 1 dosis adulta de plaquetas por aféresis. Empiece con componentes disponibles y cambie a compatibles al informar banco. O RhD negativo si potencial gestante hasta tipificar, según existencias y política; la sangre salvadora no debe demorarse. Use calentador e infusor aprobado; titule a hemostasia y perfusión.','Puente excepcional solo si sangre no disponible y hay hipoperfusión crítica: SSN 0,9 % calentada 250 mL IV en 5–10 min y revalore. Si sigue crítica y aún no hay hemoderivados, el líder decide otro 250 mL, mientras acelera sangre/control; evite bolos seriados de litros. Si hay TCE grave, evite soluciones relativamente hipotónicas y use metas neurológicas. Con hemorragia no controlada y sin TCE/lesión medular relevante, meta práctica PAS alrededor de 90 mmHg hasta hemostasia; con TCE, PAS ≥110 mmHg como objetivo inicial del simulador.'),
         group('Calcio y coagulopatía','Tras ≥2 U en transfusión importante, obtenga calcio ionizado y considere reponer según protocolo si bajo o continúa transfusión rápida: cloruro de calcio 10 % 20 mg/kg IV lento (máx. 1 g, central preferida) o gluconato cálcico 10 % 40 mg/kg IV lento (máx. 2 g, vía periférica segura). Use lumen separado de la sangre, monitor ECG. Remida tras la dosis y con cada ronda; objetivo iCa 1,1–1,3 mmol/L.','Si fibrinógeno ≤150 mg/dL o déficit viscoelástico: 3–4 g de concentrado IV o dosis adulta equivalente de crioprecipitado según banco; repetir medición. Busque plaquetas >50.000/µL en sangrado y >100.000/µL si TCE con sangrado según equipo; ajuste con laboratorio o TEG/ROTEM. Calentar a ≥36 °C. Si usa warfarina/DOAC y hay hemorragia crítica, ver Reversión hemostática en Órdenes.'),
         group('Respuesta y destino','Adecuada sostenida: mejora estable de PAS, pulso, sensorio y relleno, sin escalada transfusional → TC dirigida o de trauma, monitor y examen seriado. Transitoria: recaída tras sangre o necesita infusión continua → hemorragia activa, priorice sala de control; TC solo excepcional con equipo y traslado seguros si cambia control y no introduce demora. Nula: verifique vías y drenaje, busque HOTT, sangre y control inmediato (quirófano/híbrida).','Después de hemostasia reestablezca perfusión individualizada, controle diuresis ≥0,5 mL/kg/h si se puede sondar, lactato/defecto de base seriados y temperatura. Suspenda paquete empírico con banco al resolver sangrado y pase a corrección dirigida.')],
        'Una presión que sube con la primera sangre y vuelve a caer equivale a hemorragia no controlada. No envíe a una TC remota.', ['transfusion','bleed','nice'],'td'),
      branch('blunt-abd','Trauma cerrado esplénico, hepático o intestinal','Golpe, cinturón, fracturas costales inferiores, dolor abdominal o líquido libre.',
        [team('Inestable con eFAST positivo y probable origen intraabdominal: cirugía y laparotomía de control de daños ahora. Si hemodinámicamente estable, TC abdomen y pelvis con contraste IV multiphase según protocolo de trauma.'),
         exam('Busco extravasación, órgano sólido lesionado, lesión intestinal y respuesta sostenida antes de decidir observación.')],
        [group('Estable o estabilizado en forma sostenida','TC IV portal ± arterial/tardía según sangrado y lesión urinaria. Lesión esplénica/hepática sin otra indicación quirúrgica: observación en centro con cirugía/IR, signos/examen seriados, Hb cada 6–8 h al inicio si alto grado y luego según estabilidad. Blush, pseudoaneurisma o alto grado esplénico IV–V: IR para embolización si estable y recursos. WSES esplénico ≥AAST III: imagen de control a 48–72 h según curso.','Marca de cinturón, dolor creciente, líquido libre sin lesión sólida, estrangulación mesentérica: cirugía, observación con exámenes frecuentes y repetir TC en ≈6 h si inicial equívoca y continúa estable. Aire extraluminal específico, defecto de pared, fuga de contraste entérico o peritonitis → exploración.'),
         group('Inestabilidad','eFAST negativo no excluye víscera hueca, retroperitoneo ni hemorragia inicial pequeña. Repita eFAST si evoluciona, busque otras fuentes, y coordine con cirugía. Si se opera shock por hígado/bazo: hemostasia de control de daños, empaquetamiento o esplenectomía según anatomía y fisiología. Prevención posesplenectomía al salir de fase aguda según plan de vacunación vigente.')],
        'Líquido libre aislado con empeoramiento tras trauma de cinturón exige sospechar lesión intestinal.', ['bowel','liver','spleen','nice'],'td'),
      branch('penetrating','Penetración abdominal o toracoabdominal','Herida por arma, empalamiento, evisceración, trayecto transdiafragmático o peritonismo.',
        [team('Llame a cirugía. Si hay shock, peritonitis, víscera eviscerada o empalamiento, quirófano inmediato. Cubra las vísceras con gasas estériles húmedas con salina tibia y estabilice el objeto. Ayuno y antibiótico preincisión.'),
         exam('Si estable y examinable sin signos duros, documento orificios y trayecto; solicito TC toracoabdominopélvica IV o exploración local selectiva por cirugía.')],
        [group('Conducta por trayecto','No introduzca víscera ni extraiga objeto en el box. Explorar localmente solo heridas anteriores seleccionadas y por cirugía, sin sondaje ciego. Estabilidad, examen fiable, sin peritonitis y recursos inmediatos: manejo selectivo, examen por cirugía cada 4 h y controles seriados (WSES propone ≥48 h cuando se elige observación tras penetración de riesgo). Trayecto toracoabdominal izquierdo: valorar lesión diafragmática y laparoscopia/toracoscopia; TC negativa no la excluye.','Penetración torácica: vuelva a B y use ramas de neumotórax, hemotórax o taponamiento. Estable con trayectoria cercana a grandes vasos → angio-TC según trayecto. Inestable con sangrado/taponamiento → cirugía sin demora.'),
         group('Profilaxis y tratamiento','Ejemplo preincisión: ceftriaxona 2 g IV en 30 min más metronidazol 500 mg IV en 60 min. Inicie en urgencias sin demorar cirugía. Sin lesión de víscera hueca, no prolongue profilaxis; con lesión reparada temprano y sin infección establecida, ≤24 h. Peritonitis establecida/diagnóstico tardío: cobertura terapéutica y duración según control, como en estación 2. Revise tétanos.')],
        'La estabilidad inicial no excluye diafragma o lesión intestinal. No sacar un objeto que pueda estar taponando un vaso.', ['bowel','penAB','thorax','injury'],'td'),
      branch('pelvic','Pelvis y hemorragia retroperitoneal','Mecanismo de alta energía con dolor/deformidad pélvica o shock sin fuente evidente.',
        [team('Coloque cinturón pélvico sobre ambos trocánteres mayores, no sobre crestas ilíacas. Active transfusión y llame a ortopedia, trauma e intervencionismo.'),
         exam('No repito compresión de pelvis. Si eFAST positivo con shock, priorizo control intraabdominal manteniendo estabilización pélvica. Si eFAST negativo y shock persiste, activo control pélvico urgente.')],
        [group('Decisión','Radiografía AP portátil en inestable si cambia destino y no retrasa. Inestable pese a faja y sangre: empaquetamiento preperitoneal con fijación externa o angioembolización/híbrida según fuente y acceso inmediato. La embolización arterial complementa el control mecánico/venoso. Si responde sostenidamente, TC abdominopélvica con IV y fase arterial si sospecha vascular; blush arterial → IR, incluso si momentáneamente estable.','Sangre en meato, dificultad para orinar/trauma perineal: evite sonda uretral ciega, solicite uretrografía retrógrada en varón, avisar urología y vía alternativa bajo su control. Revise piel bajo el cinturón y acuerde retiro/estabilización definitiva con ortopedia.')],
        'Un FAST negativo no da salida a TC si sigue inestable. El cinturón va a nivel de trocánteres.', ['pelvis','bleed','nice'],'td'),
      branch('combined','Hallazgos simultáneos y shock persistente','Dos lesiones plausibles o mejoría de una función sin normalizar la perfusión.',
        [team('Mientras un operador descomprime y confirma expansión, otro inicia sangre y eFAST. Díganme presión y saturación después de cada maniobra. Cirugía, prioricemos fuente y disponibilidad de sala.'),
         exam('Si sube SpO₂ pero sigue hipotenso, reconsidero hemotórax, taponamiento y sangrado abdominal, pélvico o externo. Si pierde pulso, activo HOTT.')],
        [group('Ejemplo para el ECOE','Ausencia de murmullo derecho + PA 70/40: descompresión derecha inmediata. Luego SpO₂ 97 % y PA 74/42, eFAST abdominal positivo: active paquete de sangre, avise laparotomía urgente, coloque tubo/reevalúe sin demorar traslado al control. Si pelvis también inestable mantenga cinturón y coordine cirugías.','Si presión positiva empeora a un paciente, reconfirme tubo, circuito y tensión. Bradicardia y piel caliente tras lesión cervical orientan a shock neurogénico después de descartar hemorragia. Ante broncoespasmo, edema y shock minutos tras un fármaco, active anafilaxia y adrenalina IM adulta 0,5 mg (1 mg/mL) en muslo, repetir a los 5 min si persiste, junto a ABC y llamada experta.')],
        'Después de cada intervención vuelva a la fisiología. Una lesión tratada no descarta la segunda.', ['thorax','bleed','erc','anaph'],'td')
    ]),
    step('td','D','Déficit neurológico y médula','2:35–3:00','¿El deterioro es cerebral, medular o secundario a hipoxia/shock?',
      [patient('¿Puede apretarme las manos y mover ambos pies? ¿Siente igual a ambos lados?'),
       exam('Glasgow ocular, verbal y motor por separado; pupilas tamaño/reactividad, focalidad y nivel sensitivo. Repito tras corregir oxigenación/perfusión.'),
       team('Glucemia capilar ahora; diga Glasgow inicial y actual. Si hipoglucemia sintomática <70 mg/dL, dextrosa 10 % 150 mL IV en 10–15 min; controle glucemia en 10–15 min y repita si sigue <70.')],
      ['Registro GCS, pupilas, glucemia y cambio respecto a basal.','Defiendo perfusión cerebral y neurocirugía si sospecha de herniación.'], [
      branch('tbi','Traumatismo craneoencefálico y herniación','Glasgow ≤8, caída ≥2 puntos, anisocoria nueva, focalidad o signos de fractura.',
        [team('Neurocirugía ya si deterioro. Evite hipoxia e hipotensión, meta SpO₂ 94–98 %, PAS ≥110 y PaCO₂ 35–45. TC de cráneo sin contraste y columna cervical cuando ABC permita traslado.'),
         exam('Si nueva pupila fija con caída del Glasgow o postura compatible, elevo cabecera 30° si perfunde, cuello alineado y pido salina hipertónica 3 % 250 mL IV en 10–15 min, una vez de rescate.')],
        [group('Reconocer y proteger','La anisocoria aislada puede ser ocular; anisocoria progresiva más caída de Glasgow o posturas tras trauma presume hipertensión intracraneal/herniación. Documente E/V/M (V no evaluable tras intubación), pupilas y hora. Con vía definitiva use gas arterial y capnografía; vigile gradiente en shock. PAM alrededor de 80 o más antes de monitorización si puede; en UCI PPC usual 60–70 e intervenir PIC >22 según neurocirugía.','Tras salina hipertónica: controle sodio/osmolalidad, PA y pupilas. No repita empíricamente sin respuesta/monitorización. Hiperventilación breve PaCO₂ 30–35 solo como puente si herniación inminente, mientras cirugía controla. TC craneal sin contraste para hemorragia aguda y TC cervical sin IV si indicada. Anticoagulantes y sangrado craneal → reversión urgente específica.'),
         group('Convulsión activa','Lorazepam 0,1 mg/kg IV lento (máx. 4 mg) una vez; puede repetir una vez a los 5 min si continúa con soporte ventilatorio listo. Si persiste, levetiracetam 60 mg/kg IV (máx. 4,5 g) en 10–15 min como carga, monitor y UCI; ajuste mantenimiento posterior a función renal. Profilaxis en TCE de alto riesgo según neurocirugía y protocolo.')],
        'En TCE relevante evite hipotensión permisiva, hipoxia y sobreventilación rutinaria.', ['tbi','bleed','transfusion'],'te'),
      branch('cord','Lesión medular y shock neurogénico','Nivel sensitivo, paresia o arreflexia tras trauma; bradicardia relativa con hipotensión después de excluir sangrado.',
        [team('Mantengan alineación axial y avisen a cirugía de columna. TC de columna cervical sin contraste y segmentos según mecanismo, luego RM urgente si déficit medular o discordancia con TC.'),
         exam('Si hipotenso, primero excluyo hemorragia y lesiones torácicas. Si persiste shock neurogénico, inicio noradrenalina 0,05 mcg/kg/min IV titulada a PAM al menos 80 mmHg con monitorización.')],
        [group('Separar fisiologías','Shock medular es pérdida transitoria de reflejos y tono bajo la lesión. Shock neurogénico es vasodilatación y pérdida simpática (habitualmente cervical/torácica alta), con hipotensión y bradicardia relativa. Ambos pueden coexistir con sangrado. Revisión ASIA/ISNCSCI y sacra por personal entrenado tras estabilización.','Individualice en UCI: AO Spine sugiere PAM mínima 75–80 y no aumentarla activamente sobre 90–95 durante 3–7 días. Si euvolémico y no sangra, use bomba titulable y evalúe bradicardia sintomática con protocolo AHA. No dé metilprednisolona de rutina. Si la respiración se deteriora por lesión alta, vuelva a A/B.')],
        'Atribuir la hipotensión a médula antes de descartar hemorragia puede retrasar hemostasia.', ['spine','tbi','nice','aha'],'te')
    ]),
    step('te','E','Exposición, extremidades y calor','3:00–3:30','¿Qué lesión oculta, isquemia o complicación debo anticipar?',
      [exam('Expongo con paños. Examino axilas, dorso y periné con giro coordinado cuando sea seguro; evito manipular pelvis inestable. Registro pulsos, color, relleno, sensibilidad y motor antes y después de inmovilizar.'),
       team('Mida temperatura central si crítico. Mantas térmicas, fluidos y sangre calentados, y vuelva a cubrir. Pida alergias, medicamentos y última dosis, pasado, última ingesta y eventos (AMPLE).')],
      ['Evito hipotermia y examino áreas ocultas.','Registro neurovascular distal y coloco inmovilización cuando procede.'],[
      branch('limb','Fractura abierta, isquemia y síndrome compartimental','Herida sobre fractura, ausencia de pulso o dolor desproporcionado al estirar pasivamente.',
        [team('Trauma y ortopedia ahora. Cubra herida con gasa estéril, inmovilice, documente neurovascular antes y después. Fractura abierta: antibiótico dentro de 1 h y tétanos según antecedente.'),
         exam('Si dolor desproporcionado, compartimento tenso o dolor con estiramiento, retiro constricción y aviso fasciotomía urgente. Isquemia con signos duros → vascular y quirófano.')],
        [group('Fracturas y vasos','Cubierta húmeda con SSN estéril y férula; no explorar ni irrigar a alta presión en el box. Rx AP/lateral incluyendo articulaciones adyacentes una vez estable. Luxación/fractura con isquemia: realinee/reduzca urgente según competencia, vuelva a medir perfusión. Signos duros vasculares → quirófano, sin angio-TC si retrasa. Si signos blandos y estable, índice arterial tobillo/brazo o de presión de la extremidad <0,9 → angio-TC IV y vascular.','Profilaxis Gustilo I–II: cefazolina 2 g IV en 15–30 min ahora y cada 8 h en función renal normal; 3 g preoperatorio si ≥120 kg según protocolo. Tipo III: añada gramnegativos o ceftriaxona 2 g IV cada 24 h según protocolo institucional. Inicie ≤1 h y plan usual ≤24 h, definir con ortopedia según lesión/cierre y contaminación. Alergia inmediata grave: clindamicina 900 mg IV en ≥30 min cada 8 h para grampositivos y, si tipo III, añadir cobertura gramnegativa según protocolo y riñón.'),
         group('Tétanos y compartimento','Herida sucia/abierta: Td/Tdap 0,5 mL IM si serie completa y última ≥5 años, o si primera/antecedente desconocido. Si <3 dosis/desconocida, VIH o inmunodeficiencia grave: además inmunoglobulina antitetánica 250 UI IM en sitio distinto. Completar serie ambulatoria si faltan dosis.','Compartimento: el pulso puede estar presente. Retire yeso/vendaje constrictivo, mantenga al nivel del corazón, optimice PA. Examen claro → fasciotomía urgente. Si examen incierto/no fiable, ortopedia mide presión seriada. ΔP = PA diastólica − presión compartimental ≤30 mmHg sostenida apoya sospecha. Nunca espere desaparición de pulso.')],
        'Documente neurovascular antes y después de reducir o inmovilizar. Un pulso conservado no descarta síndrome compartimental.', ['injury','tetanus','compartment'],'tf'),
      branch('special','Lesiones especiales y trauma en embarazo','Quemadura extensa o inhalación, objeto empalado, o gestación avanzada en trauma.',
        [team('Si humo en espacio cerrado y cambios de voz o edema, oxígeno al 100 % y anestesia temprano. Si útero a nivel umbilical o mayor, desplazamiento uterino manual a izquierda y avise obstetricia.'),
         exam('Trato primero amenazas maternas. Cubro quemaduras con paños limpios secos y prevengo hipotermia; estimo porcentaje y consulto centro de quemados.')],
        [group('Quemadura en adulto','No contar eritema superficial. Si ≥20 % de superficie corporal de 2.º/3.er grado, ejemplo ABA: Ringer lactato inicial 2 mL/kg/%SCQ en primeras 24 h; la mitad hasta 8 h desde quemadura, resto en 16 h. Ej. 70 kg, 30 %: 4.200 mL/24 h, 2.100 en primeras 8 h ≈263 mL/h si se inicia de inmediato. Ajuste a diuresis ~0,5 mL/kg/h, perfusión y volumen ya recibido; no forzar volumen por reloj si llega tarde. Vía aérea amenazada → A. Humo: cooximetría/gas, lactato; oximetría usual no detecta CO.','Paciente de 70 kg y 30 % al que ya dieron 600 mL al cabo de 2 h: estimación inicial 1.500 mL restantes en 6 h = 250 mL/h, revalorar cada hora. En trauma asociado con hemorragia, controlar y transfundir por separado, sin asumir que la fórmula corrige el sangrado.'),
         group('Embarazo','A partir de aprox. 20 semanas, desplazar útero manualmente a izquierda manteniendo alineación y acceso para maniobras. Evite hipotensión permisiva. Imagen indicada para estabilizar a la madre según clínica; obstetricia y monitor fetal tras primaria según viabilidad, usual al menos 4–6 h si viabilidad y sin factores de alarma. Sangrado, contracciones, dolor uterino o trazo no tranquilizador → observación prolongada/actuación. RhD negativa no sensibilizada: obstetricia indica anti-D según edad gestacional/hemorragia feto-materna.')],
        'O₂ al 100 % en sospecha de intoxicación por CO, aunque la SpO₂ del monitor parezca normal.', ['burns','obstTrauma','atls'],'tf')
    ]),
    step('tf','↺','Reevaluación y destino','3:30–4:00','¿Qué cambió tras tratar y dónde se controla la causa?',
      [exam('Reinicio xABCDE después de cada intervención o deterioro. Comparo PA/FC, SpO₂/EtCO₂, Glasgow/pupilas, sangrado, drenajes y perfusión.'),
       team('Si se sostiene estable y hay politrauma cerrado de alto riesgo, TC según mecanismo: cráneo/cervical sin IV si indicados y tórax/abdomen/pelvis con IV; arterial dirigida si sospecha vascular. Si causa tratable con shock, traslade monitorizado a quirófano o híbrida con sangre en curso.'),
       team('Cirugía, adulto de [edad], mecanismo [ ], PA inicial [ ] y actual [ ], lesión probable [ ], recibidas [ ] U, ahora [respuesta]. Necesito [sala, IR o UCI] y equipo receptor confirmado.'),
       patient('Su estado requiere [procedimiento/observación]. Seguiremos vigilando su respiración, presión y respuesta durante el traslado.')],
      ['Entrego mecanismo, lesiones, signos, tratamiento, respuesta y el destino.','Repito primaria y confirmo quién recibe al paciente.'], [
      branch('stable-trauma','Cerrado estable o respuesta sostenida','Sin amenaza activa y perfusión sostenida, con mecanismo significativo o lesiones múltiples.',
        [exam('Hago examen secundario cabeza a pies y confirmo AMPLE. Selecciono TC/observación por riesgo y consulto destino según lesiones.'),
         team('Si nueva hipotensión, avíseme de inmediato, repito xABCDE y vuelvo a buscar hemorragia.')],
        [group('Estudios y disposición','Cerrado de alta energía con sospecha de lesiones múltiples → TC de cuerpo según centro. Lesión focal de bajo riesgo y exploración fiable → selección dirigida, no TC total por rutina. En lesión aislada dada de alta, signos de alarma escritos y reevaluación programada según lesión.','UCI para ventilación, shock, transfusión importante, lesión neurológica grave o torácica progresiva. Revisión terciaria de lesiones e imágenes en 24 h o al recuperar conciencia. Si no hay capacidad de hemostasia, active traslado precoz a centro con capacidad y mantenga cuidados de reanimación durante transporte.')],
        'Ni un examen inicial normal ni una TC equívoca sustituyen la reevaluación cuando aparecen signos nuevos.', ['atls','nice','bowel'],'tx')
    ])
  ]
};
